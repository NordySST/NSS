// RNG com semente (mulberry32). O estado fica salvo no GameState para reprodutibilidade.
var RNG = {
  state: 1,
  seed(s) { RNG.state = (s >>> 0) || 1; },
  next() {
    let t = (RNG.state = (RNG.state + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  },
  int(a, b) { return a + Math.floor(RNG.next() * (b - a + 1)); },
  range(a, b) { return a + RNG.next() * (b - a); },
  chance(p) { return RNG.next() < p; },
  pick(arr) { return arr[Math.floor(RNG.next() * arr.length)]; },
  gauss(m = 0, sd = 1) {
    let u = 0, v = 0;
    while (u === 0) u = RNG.next();
    while (v === 0) v = RNG.next();
    return m + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  },
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RNG.next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  },
  weighted(items, weights) {
    const tot = weights.reduce((s, w) => s + w, 0);
    let r = RNG.next() * tot;
    for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  },
};

var Util = {
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  lerp(a, b, t) { return a + (b - a) * t; },
  // mapeia habilidade 0..60 para [min,max]
  skillMap(level, range) { return Util.lerp(range[0], range[1], Util.clamp(level / BALANCE.skills.max, 0, 1)); },
  avg(a) { return a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0; },
  esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  fmt(n) { return Math.round(n).toLocaleString('pt-BR'); },
  fill(tpl, vars) { return tpl.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ''); },
};

// Estado único e serializável do jogo (GameState). Nada de estado escondido na interface.
var SAVE_VERSION = 1;
var SKILLS = ['pace', 'power', 'technique', 'vision', 'freekick'];

var State = {
  // cria uma carreira nova
  create(opts) {
    const B = BALANCE.start;
    const seed = opts.seed ?? Math.floor(Math.random() * 2 ** 31);
    RNG.seed(seed);
    const skills = { ...B.skills };
    const bonus = B.positionBonus[opts.pos] || {};
    for (const k in bonus) skills[k] += bonus[k];
    const world = League.createWorld(opts.country);
    // começa num clube semiprofissional da divisão mais baixa
    const lowest = world.divisions[world.divisions.length - 1];
    const clubId = RNG.pick(lowest.teams.slice().sort((a, b) => world.clubs[a].strength - world.clubs[b].strength).slice(0, 8));
    const g = {
      saveVersion: SAVE_VERSION, seed, rng: 0, createdAt: Date.now(),
      player: {
        name: opts.name, gender: opts.gender, country: opts.country, look: opts.look, pos: opts.pos,
        age: B.age, clubId, skills,
        sinceTrain: Object.fromEntries(SKILLS.map(k => [k, 0])),
        lastStars: Object.fromEntries(SKILLS.map(k => [k, null])),
        energy: B.energy, money: B.money, star: B.starRating, xp: 0, starMax: B.starRating,
        rel: { ...B.rel },
        contract: { wage: B.wage, goalBonus: B.goalBonus, assistBonus: B.assistBonus, matchesLeft: B.contractMatches },
        stats: { apps: 0, goals: 0, assists: 0, passes: 0, motm: 0, titles: 0, intl: 0 },
        season: { apps: 0, goals: 0, assists: 0, passes: 0, ratings: [] },
        scheme: 'bal', effort: 2, playedInARow: 0,
      },
      world,
      lastMatch: null,
      seen: {},
    };
    g.rng = RNG.state;
    return g;
  },

  club(g, id) { return g.world.clubs[id ?? g.player.clubId]; },
  division(g) { return g.world.divisions[State.club(g).tier]; },
  nextFixture(g) { return League.fixtureFor(g.world, g.player.clubId); },
};

// Save versionado com 3 slots (localStorage). Autosave após partida, compra e evento.
var Save = {
  key(slot) { return 'rag2_slot_' + slot; },
  write(g) {
    if (!g) return false;
    g.rng = RNG.state;
    try { localStorage.setItem(Save.key(g.slot), JSON.stringify(g)); return true; } catch (e) { return false; }
  },
  read(slot) {
    try {
      const raw = localStorage.getItem(Save.key(slot));
      if (!raw) return null;
      return Save.migrate(JSON.parse(raw));
    } catch (e) { return null; }
  },
  remove(slot) { try { localStorage.removeItem(Save.key(slot)); } catch (e) { /* ignora */ } },
  list() { return [0, 1, 2].map(i => Save.read(i)); },
  // migração entre versões do save
  migrate(g) {
    if (!g || !g.saveVersion) return null;
    // (versão 1 é a atual; futuras migrações entram aqui em sequência)
    g.saveVersion = SAVE_VERSION;
    return g;
  },
  load(slot) {
    const g = Save.read(slot);
    if (g) RNG.seed(g.rng || g.seed);
    return g;
  },
};

// Ligas: clubes fictícios, calendário de pontos corridos (ida e volta), tabela e fim de temporada.
var League = {
  createWorld(countryCode) {
    const C = COUNTRIES[countryCode] || COUNTRIES.BR;
    const S = BALANCE.season;
    const clubs = {};
    const divisions = [];
    const usedNames = new Set();
    const cities = RNG.shuffle(C.cities);
    let id = 1, ci = 0;
    for (let tier = 0; tier < S.divisionsPerCountry; tier++) {
      const [lo, hi] = BALANCE.clubs.strengthByTier[tier];
      const teams = [];
      for (let k = 0; k < S.teamsPerDivision; k++) {
        let name, city;
        do {
          city = cities[ci++ % cities.length] + (ci > cities.length ? ' ' + 'II III IV'.split(' ')[Math.floor(ci / cities.length) - 1] : '');
          const pre = RNG.pick(C.prefix);
          name = (pre ? pre + ' ' : '') + city;
        } while (usedNames.has(name));
        usedNames.add(name);
        const [c1, c2] = RNG.pick(CREST_COLORS);
        const words = city.replace(/[^A-Za-zÀ-ú ]/g, '').split(' ').filter(w => w.length > 2);
        const short = (words.length > 1 ? words[0][0] + words[1][0] + (words[2] ? words[2][0] : words[1][1]) : city.slice(0, 3)).toUpperCase();
        clubs[id] = {
          id, name, city, short, c1, c2, shape: RNG.pick(CREST_SHAPES), tier, country: countryCode,
          strength: Math.round(RNG.range(lo, hi)),
        };
        teams.push(id++);
      }
      divisions.push({ tier, name: C.leagues[tier], teams, fixtures: League.fixtures(teams) });
    }
    return { country: countryCode, clubs, divisions, season: 1, round: 0 };
  },

  // turno e returno (método do círculo)
  fixtures(ids) {
    const arr = RNG.shuffle(ids);
    const n = arr.length, rounds = [];
    for (let r = 0; r < n - 1; r++) {
      const rd = [];
      for (let i = 0; i < n / 2; i++) {
        const a = arr[i], b = arr[n - 1 - i];
        rd.push(r % 2 === 0 ? { h: a, a: b, r: null } : { h: b, a: a, r: null });
      }
      rounds.push(rd);
      arr.splice(1, 0, arr.pop());
    }
    return rounds.concat(rounds.map(rd => rd.map(m => ({ h: m.a, a: m.h, r: null }))));
  },

  divisionOf(world, clubId) { return world.divisions[world.clubs[clubId].tier]; },
  roundsInSeason(world) { return world.divisions[0].fixtures.length; },
  fixtureFor(world, clubId, round = world.round) {
    const rd = League.divisionOf(world, clubId).fixtures[round];
    return rd ? rd.find(f => f.h === clubId || f.a === clubId) : null;
  },

  poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= RNG.next(); } while (p > L); return k - 1; },

  // resultado rápido para os jogos dos outros clubes
  quickResult(world, f) {
    const sh = world.clubs[f.h].strength, sa = world.clubs[f.a].strength;
    const r = sh / sa;
    return [League.poisson(1.3 * Math.pow(r, 1.1) * BALANCE.match.homeAdv), League.poisson(1.1 * Math.pow(1 / r, 1.1))];
  },

  // completa a rodada atual (o jogo do jogador já deve ter resultado) e avança
  playRound(world) {
    world.divisions.forEach(d => {
      const rd = d.fixtures[world.round];
      if (rd) rd.forEach(f => { if (!f.r) f.r = League.quickResult(world, f); });
    });
    world.round++;
  },

  table(div) {
    const rows = {};
    div.teams.forEach(id => rows[id] = { id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 });
    div.fixtures.forEach(rd => rd.forEach(m => {
      if (!m.r) return;
      const [gh, ga] = m.r, H = rows[m.h], A = rows[m.a];
      if (!H || !A) return;
      H.p++; A.p++; H.gf += gh; H.ga += ga; A.gf += ga; A.ga += gh;
      if (gh > ga) { H.w++; A.l++; H.pts += 3; }
      else if (gh < ga) { A.w++; H.l++; A.pts += 3; }
      else { H.d++; A.d++; H.pts++; A.pts++; }
    }));
    return Object.values(rows).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || x.id - y.id);
  },

  // acesso e rebaixamento; novo calendário
  endSeason(world) {
    const slots = BALANCE.season.promotionSlots;
    const tables = world.divisions.map(d => League.table(d));
    const moves = [];
    tables.forEach((tb, tier) => {
      if (tier > 0) tb.slice(0, slots).forEach(r => moves.push([r.id, tier - 1]));
      if (tier < world.divisions.length - 1) tb.slice(-slots).forEach(r => moves.push([r.id, tier + 1]));
    });
    const champions = tables.map(tb => tb[0].id);
    moves.forEach(([id, t]) => { world.clubs[id].tier = t; });
    world.divisions.forEach((d, tier) => {
      d.teams = Object.values(world.clubs).filter(c => c.tier === tier).map(c => c.id);
      d.fixtures = League.fixtures(d.teams);
    });
    world.season++; world.round = 0;
    return { champions, moves };
  },
};

// Energia: custos, dreno na partida e recuperação.
var Energy = {
  trainCost(g) { return BALANCE.energy.trainCost; },
  canTrain(g) { return g.player.energy >= Energy.trainCost(g); },
  spend(g, amount) {
    const before = g.player.energy;
    g.player.energy = Util.clamp(before - amount, 0, 100);
    return g.player.energy - before;
  },
  // dreno por minuto em campo
  drainPerMinute(g, effort) {
    const E = BALANCE.energy;
    const paceF = Util.skillMap(Skills.effective(g, 'pace'), BALANCE.skills.map.paceDrain);
    return E.matchDrainPerMin * E.effortMult[effort - 1] * paceF;
  },
  momentCost(g) {
    return BALANCE.energy.momentCost * Util.skillMap(Skills.effective(g, 'pace'), BALANCE.skills.map.paceDrain);
  },
  recoveryAmount(g) { return BALANCE.energy.baseRecovery; },
  recover(g) {
    const before = g.player.energy;
    g.player.energy = Util.clamp(before + Energy.recoveryAmount(g), 0, 100);
    return g.player.energy - before;
  },
  // começa no banco se estiver cansado ou se o técnico não confia
  isReserve(g) {
    return g.player.energy < BALANCE.energy.reserveThreshold || g.player.rel.boss < BALANCE.relationships.bossReserveBelow;
  },
};

// Habilidades: ganho por estrelas, declínio sem treino e parâmetros derivados.
var Skills = {
  effective(g, k) { return Util.clamp(g.player.skills[k] + (g.player.bootBonus?.[k] || 0), 0, BALANCE.skills.max); },
  // estrelas pela tentativa em que acertou (0, 1, 2) ou falhou (null)
  starsFor(successAttempt) { return successAttempt == null ? 0 : 3 - successAttempt; },
  gainFor(level, stars) {
    const S = BALANCE.skills;
    if (!stars) return 0;
    if (level >= S.softCap && stars < 3) return 0;   // acima de 30 só com ★★★
    return Math.min(S.gain[stars], S.max - level);
  },
  applyTraining(g, k, stars) {
    const gain = Skills.gainFor(g.player.skills[k], stars);
    g.player.skills[k] += gain;
    g.player.sinceTrain[k] = 0;
    g.player.lastStars[k] = stars;
    return gain;
  },
  decayThreshold(age) {
    const S = BALANCE.skills;
    return age >= 32 ? S.decayAfterMatches32 : age >= 28 ? S.decayAfterMatches28 : S.decayAfterMatches;
  },
  // chamado a cada partida: habilidade sem treino perde 1 ponto a cada 2 partidas depois do limite
  tickDecay(g) {
    const th = Skills.decayThreshold(g.player.age), lost = {};
    SKILLS.forEach(k => {
      const n = ++g.player.sinceTrain[k];
      if (n > th && (n - th) % BALANCE.skills.decayEvery === 0 && g.player.skills[k] > 0) {
        g.player.skills[k]--; lost[k] = 1;
      }
    });
    return lost;
  },
  // parâmetros de jogo derivados das habilidades
  params(g) {
    const M = BALANCE.skills.map, V = BALANCE.skills.visionMates;
    const e = (k) => Skills.effective(g, k);
    const shakeLow = 1 + (1 - g.player.energy / 100) * BALANCE.energy.lowEnergyShake;
    return {
      runSpeed: Util.skillMap(e('pace'), M.paceSpeed),
      passRange: Util.skillMap(e('power'), M.passRange),
      ballSpeed: Util.skillMap(e('power'), M.ballSpeed),
      curveMax: Util.skillMap(e('technique'), M.curveMax),
      shake: Util.skillMap(e('technique'), M.aimShake) * shakeLow,
      mates: Math.min(V.max, V.base + Math.floor(e('vision') / V.per)),
      seeOffside: e('vision') >= BALANCE.skills.visionOffside,
      fk: e('freekick'),
    };
  },
};

// Nota da partida, reação de técnico/time/torcida, Star Rating e pagamento.
var Progression = {
  xpToNext(level) { const S = BALANCE.star; return S.xpBase + level * S.xpPerLevel; },

  // perf: { goals, assists, passes:{simple,good,great,stunning}, chances, fails, wasted, greedy, lost, effort, played }
  rating(perf, result) {
    const R = BALANCE.rating;
    if (!perf.played) return null;
    let r = R.base + perf.goals * R.goal + perf.assists * R.assist
      + perf.passes.good * R.passGood + perf.passes.great * R.passGreat + perf.passes.stunning * R.passStunning
      + perf.chances * R.chance + perf.fails * R.fail + R.effort[perf.effort - 1]
      + (result > 0 ? R.win : result < 0 ? R.loss : 0);
    return Util.clamp(Math.round(r * 2) / 2, 0, 10);
  },

  relDeltas(perf, result) {
    const D = BALANCE.relDelta;
    const passes = perf.passes.simple + perf.passes.good + perf.passes.great + perf.passes.stunning;
    const good = perf.passes.good + perf.passes.great + perf.passes.stunning;
    if (!perf.played) return { boss: -1, team: 0, fans: result > 0 ? 1 : result < 0 ? -1 : 0 };
    return {
      boss: Math.round(D.boss.effort[perf.effort - 1] + good * D.boss.pass + perf.wasted * D.boss.wasted + perf.fails * D.boss.fail),
      team: Math.round(passes * D.team.pass + perf.assists * D.team.assist + perf.greedy * D.team.greedyShot + perf.lost * D.team.lostBall),
      fans: Math.round(D.fans.effort[perf.effort - 1] + perf.goals * D.fans.goal + (result > 0 ? D.fans.win : result < 0 ? D.fans.loss : D.fans.draw)),
    };
  },

  applyRel(g, deltas) {
    const out = {};
    for (const k in deltas) {
      const before = g.player.rel[k];
      g.player.rel[k] = Util.clamp(before + deltas[k], 0, 100);
      out[k] = g.player.rel[k] - before;
    }
    return out;
  },

  // decaimento leve de quem não recebeu atenção (aplicado antes dos ganhos da partida)
  decayRel(g) {
    if (!BALANCE.relationships.decayEnabled) return;
    const d = BALANCE.relationships.decayPerMatch;
    for (const k in g.player.rel) g.player.rel[k] = Util.clamp(g.player.rel[k] - d, 0, 100);
  },

  // XP vem da combinação de técnico + time + torcida
  xpFrom(deltas, perf) {
    return BALANCE.star.xpPerMatch + Math.max(0, deltas.boss) + Math.max(0, deltas.team) + Math.max(0, deltas.fans) + (perf.played ? 1 : 0);
  },

  addXp(g, xp) {
    const p = g.player;
    let levels = 0;
    p.xp += xp;
    while (p.star < BALANCE.star.max && p.xp >= Progression.xpToNext(p.star)) {
      p.xp -= Progression.xpToNext(p.star); p.star++; levels++;
    }
    if (p.star >= BALANCE.star.max) p.xp = 0;
    p.starMax = Math.max(p.starMax, p.star);
    return levels;
  },

  payment(g, perf) {
    const c = g.player.contract;
    const pay = { wage: c.wage, goals: perf.goals * c.goalBonus, assists: perf.assists * c.assistBonus };
    pay.total = pay.wage + pay.goals + pay.assists;
    return pay;
  },

  marketValue(g) {
    const p = g.player;
    const skill = Util.avg(SKILLS.map(k => p.skills[k]));
    const ageF = p.age <= 21 ? 1.4 : p.age <= 26 ? 1.2 : p.age <= 30 ? 1 : 0.6;
    return Math.round((p.star * 40 + skill * skill * 3) * ageF);
  },
};

// Simulador da partida (sem interface). Gera eventos minuto a minuto e pausa nos lances do jogador.
var Match = {
  create(g, fixture, opts) {
    const p = g.player, M = BALANCE.match;
    const mySide = fixture.h === p.clubId ? 0 : 1;
    const reserve = Energy.isReserve(g);
    const m = {
      fixture: { h: fixture.h, a: fixture.a }, mySide, minute: 0, score: [0, 0], events: [],
      scheme: opts.scheme || p.scheme, effort: opts.effort || p.effort,
      reserve, onPitch: !reserve, enterAt: reserve ? 46 : 0, subbedOff: false, done: false,
      weather: RNG.pick(['sun', 'sun', 'cloud', 'rain']),
      perf: { goals: 0, assists: 0, passes: { simple: 0, good: 0, great: 0, stunning: 0 }, chances: 0, fails: 0, wasted: 0, greedy: 0, lost: 0, effort: opts.effort || p.effort, played: false },
      moments: [], pending: null,
    };
    Match.planMoments(g, m);
    return m;
  },

  // quantos lances e em que minutos
  planMoments(g, m) {
    const M = BALANCE.match;
    let n = RNG.int(M.momentsMin, M.momentsMax) * M.effortMoments[m.effort - 1] * (0.85 + g.player.rel.team / 333);
    if (m.reserve) n *= M.reserveMoments;
    n = Math.max(1, Math.round(n));
    const from = Math.max(3, m.enterAt + 2), mins = new Set();
    let guard = 0;
    while (mins.size < n && guard++ < 500) mins.add(RNG.int(from, 88));
    m.moments = [...mins].sort((a, b) => a - b);
  },

  strengths(g, m) {
    const W = g.world, M = BALANCE.match;
    const s = [W.clubs[m.fixture.h].strength, W.clubs[m.fixture.a].strength];
    // o jogador também pesa um pouco na força do time
    const me = Util.avg(SKILLS.map(k => Skills.effective(g, k))) / 60 * 100;
    if (m.onPitch) s[m.mySide] = s[m.mySide] * 0.92 + me * 0.08;
    const att = s.slice(), def = s.slice();
    const sch = m.scheme === 'att' ? M.schemeAttack : m.scheme === 'def' ? M.schemeDefend : null;
    if (sch) { att[m.mySide] *= sch.att; def[m.mySide] *= sch.def; }
    att[0] *= M.homeAdv;
    return { att, def };
  },

  momentType(g, m) {
    const M = BALANCE.match;
    const mix = { ...M.momentMix[g.player.pos] };
    if (m.scheme === 'att') { mix.attack += M.schemeShift; mix.intercept = Math.max(0.05, mix.intercept - M.schemeShift); }
    if (m.scheme === 'def') { mix.intercept += M.schemeShift; mix.attack = Math.max(0.05, mix.attack - M.schemeShift); }
    return RNG.weighted(['intercept', 'pass', 'attack'], [mix.intercept, mix.pass, mix.attack]);
  },

  ev(m, type, side, extra) { const e = { min: m.minute, type, side, ...extra }; m.events.push(e); return e; },

  // avança 1 minuto. Retorna { events, moment } — moment != null pausa para um lance jogável
  step(g, m) {
    if (m.done) return { events: [], moment: null };
    const start = m.events.length;
    m.minute++;
    const p = g.player;
    if (!m.onPitch && !m.subbedOff && m.minute >= m.enterAt && m.enterAt > 0) {
      m.onPitch = true; Match.ev(m, 'enter', m.mySide);
    }
    if (m.onPitch) {
      m.perf.played = true;
      Energy.spend(g, Energy.drainPerMinute(g, m.effort));
      if (p.energy <= 0) { m.onPitch = false; m.subbedOff = true; Match.ev(m, 'subOff', m.mySide); }
    }
    // jogo dos times
    const { att, def } = Match.strengths(g, m);
    for (let s = 0; s < 2; s++) {
      const ratio = att[s] / def[1 - s];
      if (RNG.chance(BALANCE.match.chancePerMin * Math.pow(ratio, BALANCE.match.strengthExp))) {
        if (RNG.chance(BALANCE.match.goalPerChance * Math.pow(ratio, 0.8))) { m.score[s]++; Match.ev(m, 'goal', s); }
        else Match.ev(m, RNG.chance(0.45) ? 'save' : 'shot', s);
      }
    }
    if (RNG.chance(0.012)) Match.ev(m, 'card', RNG.int(0, 1));
    if (RNG.chance(0.02)) Match.ev(m, 'foul', RNG.int(0, 1));
    if (m.minute === 45) Match.ev(m, 'half', -1);
    let moment = null;
    if (m.onPitch && m.moments.length && m.moments[0] <= m.minute) {
      m.moments.shift();
      moment = { type: Match.momentType(g, m) };
      m.pending = moment;
      Energy.spend(g, Energy.momentCost(g));
    }
    if (m.minute >= 90) { m.done = true; Match.ev(m, 'end', -1); }
    return { events: m.events.slice(start), moment };
  },

  passClass(distM, backwards) {
    const P = BALANCE.passRating;
    if (backwards || distM < P.good) return 'simple';
    if (distM >= P.stunning) return 'stunning';
    if (distM >= P.great) return 'great';
    return 'good';
  },

  // aplica o resultado de um lance jogável. Pode encadear outro lance (interceptação -> passe).
  // res: { type, ok, result?, dist?, backwards?, greedy? }
  resolve(g, m, res) {
    const pf = m.perf, s = m.mySide;
    m.pending = null;
    let next = null;
    if (res.type === 'intercept') {
      if (res.ok) { Match.ev(m, 'intercept', s, { mine: true }); next = { type: 'pass' }; }
      else { pf.fails++; Match.ev(m, 'missIntercept', s, { mine: true }); }
    } else if (res.type === 'pass') {
      if (res.ok) {
        const cls = Match.passClass(res.dist, res.backwards);
        pf.passes[cls]++;
        Match.ev(m, 'pass', s, { mine: true, cls });
        // o time aproveita o seu passe: às vezes vira gol com assistência sua
        if (!res.backwards && RNG.chance(BALANCE.match.passGoalChance[cls])) {
          m.score[s]++; pf.assists++; Match.ev(m, 'goal', s, { assist: true, mine: true });
        } else if (!res.backwards && RNG.chance(0.35)) next = { type: 'attack' };
      } else { pf.fails++; pf.lost++; Match.ev(m, 'lost', s, { mine: true }); }
    } else if (res.type === 'attack') {
      if (res.greedy) pf.greedy++;
      if (res.result === 'goal') { m.score[s]++; pf.goals++; pf.chances++; Match.ev(m, 'goal', s, { mine: true }); }
      else if (res.result === 'assist') { m.score[s]++; pf.assists++; pf.chances++; Match.ev(m, 'goal', s, { assist: true, mine: true }); }
      else if (res.result === 'saved' || res.result === 'miss') { pf.chances++; pf.wasted++; Match.ev(m, res.result === 'saved' ? 'save' : 'shot', s, { mine: true }); }
      else { pf.fails++; pf.lost++; Match.ev(m, 'lost', s, { mine: true }); }
    }
    if (next) m.pending = next;
    return next;
  },

  // resolve automaticamente (simular até o fim)
  autoResolve(g, m, moment) {
    const pr = Skills.params(g), sk = Util.avg(SKILLS.map(k => Skills.effective(g, k))) / 60;
    if (moment.type === 'intercept') return { type: 'intercept', ok: RNG.chance(0.35 + sk * 0.4) };
    if (moment.type === 'pass') return { type: 'pass', ok: RNG.chance(0.55 + sk * 0.35), dist: RNG.range(8, pr.passRange) };
    const r = RNG.next();
    return { type: 'attack', result: r < 0.12 + sk * 0.25 ? 'goal' : r < 0.2 + sk * 0.3 ? 'assist' : r < 0.6 ? 'saved' : 'lost' };
  },

  // fecha a partida: nota, relações, XP, pagamento, estatísticas, liga
  finish(g, m) {
    const p = g.player, W = g.world;
    const my = m.score[m.mySide], ot = m.score[1 - m.mySide];
    const result = Math.sign(my - ot);
    const fx = League.fixtureFor(W, p.clubId);
    fx.r = m.score.slice();
    const rating = Progression.rating(m.perf, result);
    Progression.decayRel(g);
    const deltas = Progression.relDeltas(m.perf, result);
    const relOut = Progression.applyRel(g, deltas);
    const xp = Progression.xpFrom(deltas, m.perf);
    const starBefore = p.star;
    const levels = Progression.addXp(g, xp);
    const pay = Progression.payment(g, m.perf);
    p.money += pay.total;
    const passes = Object.values(m.perf.passes).reduce((a, b) => a + b, 0);
    p.stats.apps += m.perf.played ? 1 : 0; p.stats.goals += m.perf.goals; p.stats.assists += m.perf.assists; p.stats.passes += passes;
    p.season.apps += m.perf.played ? 1 : 0; p.season.goals += m.perf.goals; p.season.assists += m.perf.assists; p.season.passes += passes;
    if (rating != null) p.season.ratings.push(rating);
    // craque do jogo: sua nota contra uma nota estimada dos outros
    const best = 6.5 + RNG.range(0, 1.6) + (result < 0 ? -0.5 : 0);
    const motm = rating != null && rating >= 7 && rating >= best;
    if (motm) p.stats.motm++;
    p.contract.matchesLeft = Math.max(0, p.contract.matchesLeft - 1);
    const decayed = Skills.tickDecay(g);
    League.playRound(W);
    let season = null;
    if (W.round >= League.roundsInSeason(W)) {
      const div = League.divisionOf(W, p.clubId);
      const pos = League.table(div).findIndex(r => r.id === p.clubId) + 1;
      season = League.endSeason(W);
      season.pos = pos; season.divName = div.name;
      p.age++;
      p.season = { apps: 0, goals: 0, assists: 0, passes: 0, ratings: [] };
    }
    const summary = {
      score: m.score.slice(), mySide: m.mySide, fixture: m.fixture, result, rating, motm,
      perf: m.perf, passes, deltas: relOut, xp, levels, starBefore, starAfter: p.star, pay, decayed, season,
      reserve: m.reserve, subbedOff: m.subbedOff,
    };
    g.lastMatch = summary;
    return summary;
  },
};

// Motor dos minigames e lances: câmera, física da bola (metros), controle de chute e desenho.
// Coordenadas do mundo em metros: x para a direita, y para baixo (o gol fica em y = 0, no topo).
var MG = {
  W: 960, H: 540, TILT: 0.8, DT: 1 / 60,

  // velocidade da simulação dos lances (ajuste do jogador)
  SPEEDS: { slow: 0.4, normal: 0.6, fast: 0.85 },
  speedKey() { try { return localStorage.getItem('rag2_speed') || 'normal'; } catch (e) { return 'normal'; } },
  speed() { return MG.SPEEDS[MG.speedKey()] || 0.6; },
  setSpeed(k) { try { localStorage.setItem('rag2_speed', k); } catch (e) { /* ignora */ } },

  camera(cx, cy, ppm) { return { cx, cy, ppm }; },
  // câmera que enquadra um retângulo do mundo
  fit(x0, y0, x1, y1) {
    const ppm = Math.min(MG.W / (x1 - x0), MG.H / ((y1 - y0) * MG.TILT));
    return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, ppm };
  },
  toScreen(cam, x, y, z = 0) {
    return [MG.W / 2 + (x - cam.cx) * cam.ppm, MG.H / 2 + (y - cam.cy) * cam.ppm * MG.TILT - z * cam.ppm * 0.9];
  },
  toWorld(cam, sx, sy) {
    return { x: cam.cx + (sx - MG.W / 2) / cam.ppm, y: cam.cy + (sy - MG.H / 2) / (cam.ppm * MG.TILT) };
  },
  pointer(canvas, e) {
    const r = canvas.getBoundingClientRect();
    return { sx: (e.clientX - r.left) * MG.W / r.width, sy: (e.clientY - r.top) * MG.H / r.height };
  },

  // ---------- física ----------
  ball(x, y) { return { x, y, z: 0, vx: 0, vy: 0, vz: 0, spin: 0, moving: false, t: 0 }; },
  wind(level) {
    const B = BALANCE.minigame;
    if (level < BALANCE.skills.windFromLevel) return { x: 0, y: 0, s: 0 };
    const s = B.windMax * Util.clamp((level - BALANCE.skills.windFromLevel) / 45 + RNG.range(0.1, 0.5), 0.15, 1);
    const a = RNG.range(0, Math.PI * 2);
    return { x: Math.cos(a) * s, y: Math.sin(a) * s, s };
  },
  stepBall(b, wind) {
    const B = BALANCE.minigame, dt = MG.DT;
    if (!b.moving) return;
    b.t += dt;
    const sp = Math.hypot(b.vx, b.vy);
    if (b.spin && sp > 0.5) {   // efeito (curva) perpendicular à direção
      const k = B.spinAccel * b.spin * Math.min(1, sp / 18) * dt;
      b.vx += -b.vy / sp * k; b.vy += b.vx / sp * k;
      b.spin *= 0.996;
    }
    if (wind && wind.s) { const f = b.z > 0.3 ? 1 : 0.15; b.vx += wind.x * f * dt; b.vy += wind.y * f * dt; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    if (b.z > 0 || b.vz > 0) b.vz -= B.gravity * dt;
    if (b.z <= 0) {
      b.z = 0;
      if (b.vz < -2) { b.vz = -b.vz * 0.45; b.vx *= 0.8; b.vy *= 0.8; } else b.vz = 0;
    }
    const drag = 1 - B.airDrag;
    b.vx *= drag; b.vy *= drag;
    if (b.z === 0 && b.vz === 0) {   // rolando
      const s2 = Math.hypot(b.vx, b.vy), dec = B.rollDecel * dt;
      if (s2 <= dec) { b.vx = b.vy = 0; b.moving = false; } else { b.vx -= b.vx / s2 * dec; b.vy -= b.vy / s2 * dec; }
    }
  },
  // chute: ângulo (rad), força 0..1, curva -1..1
  kick(b, ang, power, curve, pr) {
    const B = BALANCE.minigame.kick;
    const h = (B.base + power * B.perPower * Math.sqrt(pr.passRange / 30)) * pr.ballSpeed;
    b.vx = Math.cos(ang) * h; b.vy = Math.sin(ang) * h;
    b.vz = Math.max(0, power - B.loftFrom) * B.loft;
    b.spin = curve * pr.curveMax;
    b.moving = true; b.t = 0;
  },
  // prevê a trajetória (sem vento e sem efeito) para a linha pontilhada
  predict(b, ang, power, pr, steps = 90) {
    const t = { ...b }; MG.kick(t, ang, power, 0, pr);
    const pts = [];
    for (let i = 0; i < steps && t.moving; i++) { MG.stepBall(t, null); if (i % 3 === 0) pts.push([t.x, t.y, t.z]); }
    return pts;
  },
  // bola passa perto de um objeto (cilindro de raio r e altura h)?
  hits(b, o, r, h = 1.9) { return Math.hypot(b.x - o.x, b.y - o.y) < r + 0.11 && b.z < h; },

  // goleiro: se posiciona na direção da bola e tenta defender quando ela cruza a linha
  gk(q) { return { x: 0, y: 0.6, q, react: 0, dive: 0 }; },
  stepGK(gk, b, dt = MG.DT) {
    const sp = 2.5 + gk.q * 4.5;
    let tx = b.x * 0.35;
    if (b.moving && b.vy < -0.5) {
      gk.react += dt;
      if (gk.react > 0.22 - gk.q * 0.12) tx = b.x + b.vx * ((b.y - gk.y) / -b.vy);
    }
    tx = Util.clamp(tx, -3.4, 3.4);
    gk.x += Util.clamp(tx - gk.x, -sp * dt, sp * dt);
  },
  // resultado no gol: 'goal' | 'saved' | 'post' | 'over' | 'wide' | null (ainda não chegou)
  goalCheck(b, gk) {
    const B = BALANCE.minigame, half = B.goalWidth / 2;
    if (gk && b.vy < 0 && b.y <= gk.y + 0.3 && b.y >= gk.y - 0.4) {
      const reach = 0.75 + gk.q * 1.1, sp = Math.hypot(b.vx, b.vy);
      if (Math.abs(b.x - gk.x) < reach && b.z < 2.2 + gk.q * 0.3 && !(sp > 20 && RNG.chance((sp - 20) * 0.05))) {
        b.vy = -b.vy * 0.35; b.vx = (b.x - gk.x) * 3; b.vz = 2;
        gk.dive = Math.sign(b.x - gk.x) || 1;
        return 'saved';
      }
    }
    if (b.y <= 0) {
      if (Math.abs(Math.abs(b.x) - half) < 0.12 && b.z < B.barHeight) { b.vy = -b.vy * 0.5; return 'post'; }
      if (Math.abs(b.x) < half && Math.abs(b.z - B.barHeight) < 0.1) { b.vy = -b.vy * 0.5; return 'post'; }
      if (Math.abs(b.x) < half && b.z < B.barHeight) { b.vx *= 0.2; b.vy *= 0.2; return 'goal'; }
      return b.z >= B.barHeight && Math.abs(b.x) < half + 1 ? 'over' : 'wide';
    }
    return null;
  },

  // ---------- controle do chute: arrastar a partir da bola -> soltar -> tocar na barra de efeito ----------
  KickControl(opts) {
    const c = {
      phase: 'idle', drag: null, ang: 0, power: 0, bar: 0, barT: 0, t: 0,
      canStart: opts.canStart || (() => true),
      onKick: opts.onKick,
      pr: opts.pr,
      // atalho: chuta direto para um ponto (cartões de passe)
      kickTo(target, from) {
        const d = Math.hypot(target.x - from.x, target.y - from.y);
        c.onKick(Math.atan2(target.y - from.y, target.x - from.x), Util.clamp(0.35 + d / (c.pr.passRange * 1.4), 0.3, 1), 0);
        c.phase = 'done';
      },
    };
    const MAXDRAG = 230;
    c.down = (p, ballScreen) => {
      if (c.phase === 'effect') { c.release(); return true; }
      if (c.phase !== 'idle' || !c.canStart()) return false;
      if (Math.hypot(p.sx - ballScreen[0], p.sy - ballScreen[1]) > 80) return false;
      c.phase = 'drag'; c.drag = { ...p, bs: ballScreen }; c.cur = p; return true;
    };
    c.move = (p) => { if (c.phase === 'drag') c.cur = p; };
    c.up = () => {
      if (c.phase !== 'drag') return;
      const dx = c.cur.sx - c.drag.bs[0], dy = (c.cur.sy - c.drag.bs[1]) / MG.TILT;
      const len = Math.hypot(dx, dy);
      if (len < 20) { c.phase = 'idle'; return; }
      c.ang = Math.atan2(dy, dx) + c.wobble(); c.power = Math.min(1, len / MAXDRAG);
      c.phase = 'effect'; c.barT = 0;
    };
    c.release = () => {
      if (c.phase !== 'effect') return;
      c.phase = 'done';
      c.onKick(c.ang, c.power, c.bar);
    };
    // tremido da mira (menor com Técnica alta)
    c.wobble = () => c.pr.shake * 0.07 * Math.sin(c.t * 7.3) + c.pr.shake * 0.03 * Math.sin(c.t * 17.1);
    c.aim = () => {
      if (c.phase !== 'drag') return null;
      const dx = c.cur.sx - c.drag.bs[0], dy = (c.cur.sy - c.drag.bs[1]) / MG.TILT;
      const len = Math.hypot(dx, dy);
      return { ang: Math.atan2(dy, dx) + c.wobble(), power: Math.min(1, len / MAXDRAG), len };
    };
    c.update = (dt) => {
      c.t += dt;
      if (c.phase === 'effect') {
        c.barT += dt;
        c.bar = Math.sin(c.barT / BALANCE.minigame.effectBarPeriod * Math.PI * 2);
        if (c.barT > BALANCE.minigame.effectBarTimeout) { c.bar = 0; c.release(); }
      }
    };
    c.reset = () => { c.phase = 'idle'; c.drag = null; };
    return c;
  },

  // ---------- desenho ----------
  drawPitch(ctx, cam, opts = {}) {
    ctx.fillStyle = '#2c8a3e'; ctx.fillRect(0, 0, MG.W, MG.H);
    // faixas do gramado (a cada 5 m)
    for (let y = -10; y < 80; y += 5) {
      if (((y / 5) | 0) % 2) continue;
      const a = MG.toScreen(cam, 0, y)[1], b = MG.toScreen(cam, 0, y + 5)[1];
      ctx.fillStyle = '#33964a'; ctx.fillRect(0, a, MG.W, b - a);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
    const line = (pts) => { ctx.beginPath(); pts.forEach(([x, y], i) => { const s = MG.toScreen(cam, x, y); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); ctx.stroke(); };
    line([[-34, 0], [34, 0]]);
    line([[-20.15, 0], [-20.15, 16.5], [20.15, 16.5], [20.15, 0]]);
    line([[-9.15, 0], [-9.15, 5.5], [9.15, 5.5], [9.15, 0]]);
    const ps = MG.toScreen(cam, 0, 11); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ps[0], ps[1], 3, 0, 7); ctx.fill();
    const arc = []; for (let a = 0.93; a <= 2.21; a += 0.05) arc.push([Math.cos(a) * 9.15, 11 + Math.sin(a) * 9.15]);
    line(arc);
    if (opts.half) line([[-34, 52.5], [34, 52.5]]);
    if (opts.goal !== false) MG.drawGoal(ctx, cam, 'back');
  },
  drawGoal(ctx, cam, part) {
    const B = BALANCE.minigame, hw = B.goalWidth / 2, bh = B.barHeight;
    const P = (x, y, z) => MG.toScreen(cam, x, y, z);
    if (part === 'back') {   // rede atrás
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      const a = P(-hw, -1.8, 0), b = P(hw, -1.8, 0), c = P(hw, -1.8, bh * 0.8), d = P(-hw, -1.8, bh * 0.8);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c); ctx.lineTo(...d); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
      for (let x = -hw; x <= hw; x += 0.6) { ctx.beginPath(); ctx.moveTo(...P(x, -1.8, 0)); ctx.lineTo(...P(x, -1.8, bh * 0.8)); ctx.stroke(); }
      return;
    }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(...P(-hw, 0, 0)); ctx.lineTo(...P(-hw, 0, bh)); ctx.lineTo(...P(hw, 0, bh)); ctx.lineTo(...P(hw, 0, 0)); ctx.stroke();
  },
  // boneco visto de cima com leve inclinação
  drawPlayer(ctx, cam, x, y, o = {}) {
    const s = MG.toScreen(cam, x, y), r = Math.max(8, 0.55 * cam.ppm);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(s[0], s[1] + 2, r * 1.1, r * 0.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = o.shirt || '#1e88e5'; ctx.beginPath(); ctx.ellipse(s[0], s[1] - r * 0.9, r * 0.95, r * 1.05, 0, 0, 7); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = o.trim || 'rgba(0,0,0,.35)'; ctx.stroke();
    ctx.fillStyle = o.skin || '#e8b48f'; ctx.beginPath(); ctx.arc(s[0], s[1] - r * 2.1, r * 0.62, 0, 7); ctx.fill();
    if (o.hair) { ctx.fillStyle = o.hair; ctx.beginPath(); ctx.arc(s[0], s[1] - r * 2.25, r * 0.6, Math.PI, 0); ctx.fill(); }
    if (o.boot) { ctx.fillStyle = o.boot; ctx.fillRect(s[0] - r * 0.7, s[1] - r * 0.2, r * 0.5, r * 0.35); ctx.fillRect(s[0] + r * 0.2, s[1] - r * 0.2, r * 0.5, r * 0.35); }
    if (o.ring) { ctx.strokeStyle = o.ring; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(s[0], s[1] + 2, r * 1.5, r * 0.7, 0, 0, 7); ctx.stroke(); }
    if (o.flag) { ctx.fillStyle = '#ffeb3b'; ctx.fillRect(s[0] + r, s[1] - r * 3.2, r * 0.9, r * 0.6); ctx.fillStyle = '#e53935'; ctx.fillRect(s[0] + r, s[1] - r * 3.2, r * 0.18, r * 1.5); }
    if (o.balloon) {
      const bx = s[0], by = s[1] - r * 3.6;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(bx, by, r * 1.1, r * 0.8, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx - 3, by + r * 0.6); ctx.lineTo(bx, by + r * 1.1); ctx.lineTo(bx + 4, by + r * 0.6); ctx.fill();
      ctx.fillStyle = '#111'; ctx.font = `bold ${Math.round(r)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⚽', bx, by + 1);
    }
    return s;
  },
  drawBall(ctx, cam, b) {
    const g = MG.toScreen(cam, b.x, b.y, 0), s = MG.toScreen(cam, b.x, b.y, b.z);
    const r = Math.max(6, 0.3 * cam.ppm) * (1 + b.z * 0.06);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(g[0], g[1], r, r * 0.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s[0], s[1] - r * 0.6, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(s[0], s[1] - r * 0.6, r * 0.35, 0, 7); ctx.fill();
    return [s[0], s[1] - r * 0.6];
  },
  drawAim(ctx, cam, b, kc) {
    const a = kc.aim();
    if (!a) return;
    const pts = MG.predict(b, a.ang, a.power, kc.pr);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    pts.forEach(([x, y, z], i) => { const s = MG.toScreen(cam, x, y, z); ctx.globalAlpha = 1 - i / pts.length * 0.8; ctx.beginPath(); ctx.arc(s[0], s[1], 3, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    // medidor de força
    const x = 24, y = MG.H - 150;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x, y, 18, 120);
    ctx.fillStyle = a.power > 0.85 ? '#ff5252' : '#69f0ae'; ctx.fillRect(x + 2, y + 2 + 116 * (1 - a.power), 14, 116 * a.power);
  },
  drawEffectBar(ctx, kc) {
    if (kc.phase !== 'effect') return;
    const w = 360, x = (MG.W - w) / 2, y = MG.H - 70;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x - 10, y - 14, w + 20, 46);
    const grd = ctx.createLinearGradient(x, 0, x + w, 0);
    grd.addColorStop(0, '#42a5f5'); grd.addColorStop(0.5, '#ffffff'); grd.addColorStop(1, '#ff7043');
    ctx.fillStyle = grd; ctx.fillRect(x, y, w, 18);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('↶', x - 26, y + 9); ctx.fillText('↷', x + w + 26, y + 9);
    const mx = x + (kc.bar + 1) / 2 * w;
    ctx.fillStyle = '#111'; ctx.fillRect(mx - 4, y - 8, 8, 34);
    ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 2; ctx.strokeRect(mx - 4, y - 8, 8, 34);
  },
  drawWind(ctx, wind) {
    if (!wind || !wind.s) return;
    const cx = MG.W - 120, cy = 48, L = 14 + wind.s * 10;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(wind.y * MG.TILT, wind.x));
    ctx.fillStyle = '#e3f2fd'; ctx.strokeStyle = '#0d47a1'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-L, -5); ctx.lineTo(L - 8, -5); ctx.lineTo(L - 8, -11); ctx.lineTo(L + 6, 0); ctx.lineTo(L - 8, 11); ctx.lineTo(L - 8, 5); ctx.lineTo(-L, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  },
  // carimbo animado (única exceção de texto: 1 palavra)
  drawStamp(ctx, text, t, color = '#ffd740') {
    if (t <= 0) return;
    const s = 1 + Math.max(0, 0.4 - (1.6 - t)) * 1.5;
    ctx.save(); ctx.globalAlpha = Math.min(1, t); ctx.translate(MG.W / 2, MG.H / 2 - 40); ctx.rotate(-0.12); ctx.scale(s, s);
    ctx.font = 'bold 54px "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(text, 0, 0);
    ctx.fillStyle = color; ctx.fillText(text, 0, 0);
    ctx.restore();
  },
  drawIconBig(ctx, icon, t) {
    if (t <= 0) return;
    ctx.save(); ctx.globalAlpha = Math.min(1, t); ctx.font = '120px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(icon, MG.W / 2, MG.H / 2); ctx.restore();
  },

  // laço com passos fixos de física (funciona igual em 60/90/120 Hz)
  loop(step, draw) {
    const L = { raf: 0, last: 0, acc: 0, stopped: false };
    const tick = (now) => {
      if (L.stopped) return;
      const dt = Math.min(0.05, (now - (L.last || now)) / 1000); L.last = now;
      L.acc += dt * MG.speed();
      if (MG.paused) L.acc = 0;
      while (L.acc >= MG.DT) { step(MG.DT); L.acc -= MG.DT; }
      draw(dt);
      L.raf = requestAnimationFrame(tick);
    };
    L.raf = requestAnimationFrame(tick);
    L.stop = () => { L.stopped = true; cancelAnimationFrame(L.raf); };
    return L;
  },
};

// Os 5 minigames de treino. Cada um: até 3 tentativas; acertar na 1ª = ★★★, 2ª = ★★, 3ª = ★.
var Drills = {
  icons: { pace: '👟', power: '💥', technique: '🌀', vision: '👁', freekick: '🎯' },

  // monta a cena de uma tentativa conforme o nível da habilidade
  setup: {
    power(L, B) {
      const t = L / 60, d = Util.lerp(B.power.dist[0], B.power.dist[1], t);
      const ball = MG.ball(RNG.range(-7, 7), d);
      return { ball, gk: MG.gk(Util.lerp(B.power.gk[0], B.power.gk[1], t)), cam: MG.fit(-22, -5, 22, d + 6), goal: true };
    },
    technique(L, B) {
      const t = L / 60, d = Util.lerp(B.technique.dist[0], B.technique.dist[1], t), gap = Util.lerp(B.technique.gap[0], B.technique.gap[1], t);
      const cx = RNG.range(-4, 4);
      return { ball: MG.ball(RNG.range(-3, 3), d), poles: [{ x: cx - gap / 2, y: 2 }, { x: cx + gap / 2, y: 2 }], cam: MG.fit(-18, -4, 18, d + 6), goal: false };
    },
    vision(L, B) {
      const t = L / 60, d = Util.lerp(B.vision.dist[0], B.vision.dist[1], t);
      const target = { x: RNG.range(-6, 6), y: 3, bx: 0, moving: L >= B.vision.moveFrom, phase: RNG.range(0, 6), target: true };
      target.bx = target.x;
      const dummies = [target];
      if (L >= B.vision.decoyFrom) for (let i = 0; i < 2; i++) dummies.push({ x: target.x + (i ? 1 : -1) * RNG.range(2.2, 4), y: 3 + RNG.range(-1.5, 1.5), decoy: true });
      return { ball: MG.ball(RNG.range(-4, 4), d), dummies, cam: MG.fit(-18, -3, 18, d + 6), goal: false };
    },
    freekick(L, B) {
      const t = L / 60, d = Util.lerp(B.freekick.dist[0], B.freekick.dist[1], t);
      const ball = MG.ball(RNG.range(-10, 10), d);
      const ang = Math.atan2(0 - ball.y, 0 - ball.x), n = L >= 30 ? 5 : L >= 12 ? 4 : 3;
      const wx = ball.x + Math.cos(ang) * 9.15, wy = ball.y + Math.sin(ang) * 9.15;
      const wall = [];
      for (let i = 0; i < n; i++) { const k = i - (n - 1) / 2; wall.push({ x: wx - Math.sin(ang) * k * 0.6, y: wy + Math.cos(ang) * k * 0.6 }); }
      return { ball, wall, gk: L >= B.freekick.gkFrom ? MG.gk(Util.lerp(B.freekick.gk[0], B.freekick.gk[1], t)) : null, cam: MG.fit(-22, -5, 22, d + 6), goal: true };
    },
    pace(L, B) {
      const t = L / 60;
      const sp = Util.lerp(B.pace.ballSpeed[0], B.pace.ballSpeed[1], t);
      const dir = RNG.chance(0.5) ? 1 : -1;
      const mk = (y, delay, fake) => ({ x: -dir * 26, y, z: 0, vx: dir * sp * (fake ? RNG.range(0.85, 1.15) : 1), vy: 0, delay, fake, gone: false });
      const lineY = RNG.range(8, 12);
      const balls = [mk(lineY, 0, false)];
      if (L >= B.pace.fakeFrom) { balls.push(mk(lineY + RNG.range(-5, -3), RNG.range(0, 0.5), true)); balls.push(mk(lineY + RNG.range(3, 5), RNG.range(0, 0.5), true)); }
      const me = { x: RNG.range(-6, 6), y: lineY + Util.lerp(B.pace.startDist[0], B.pace.startDist[1], t), vx: 0, vy: 0 };
      return { pace: true, balls, me, dir, inertia: L >= B.pace.inertiaFrom, cam: MG.fit(-26, lineY - 10, 26, lineY + 16), goal: false };
    },
  },

  // abre o minigame em tela cheia. onDone(stars, successAttempt)
  run(host, kind, g, opts, onDone) {
    const B = BALANCE.minigame, L = Skills.effective(g, kind), pr = Skills.params(g);
    const look = g.player.look;
    host.innerHTML = `
      <canvas id="mg-canvas" width="${MG.W}" height="${MG.H}"></canvas>
      <div class="mg-hud">
        <button class="icon-btn mg-exit" data-tip="${STR.icons.back}">✖</button>
        <div id="mg-tries" class="tries"></div>
        <div class="mg-kind">${Drills.icons[kind]} <b>${L}</b></div>
        <div id="mg-wind" class="mg-wind-slot"></div>
        <div class="mg-speed">${UI.speedPicker()}</div>
      </div>`;
    const cv = host.querySelector('#mg-canvas'), ctx = cv.getContext('2d');
    const triesEl = host.querySelector('#mg-tries');
    let attempt = 0, success = null, S = null, kc = null, flash = null, loop = null, finished = false;
    const results = [];

    const renderTries = () => {
      triesEl.innerHTML = [0, 1, 2].map(i => `<span class="try ${results[i] === true ? 'ok' : results[i] === false ? 'bad' : i === attempt ? 'cur' : ''}"></span>`).join('');
    };

    const newAttempt = () => {
      S = Drills.setup[kind](L, B);
      S.wind = kind === 'pace' ? null : MG.wind(L);
      S.state = 'play'; S.t = 0; S.result = null;
      MG.debug = { get S() { return S; }, get kc() { return kc; } };
      if (!S.pace) {
        kc = MG.KickControl({ pr, onKick: (ang, power, curve) => { MG.kick(S.ball, ang, power, curve, pr); S.kicked = true; } });
      }
      renderTries();
    };

    const endAttempt = (ok) => {
      if (S.state !== 'play') return;
      S.state = 'result'; results[attempt] = ok;
      flash = { icon: ok ? '✔' : '✖', t: 1.4, color: ok ? '#69f0ae' : '#ff5252' };
      Sound.play(ok ? 'good' : 'bad');
      setTimeout(() => {
        if (finished) return;
        if (ok) { success = attempt; return finish(); }
        attempt++;
        if (attempt >= B.attempts) return finish();
        newAttempt();
      }, 1300);
    };

    const finish = () => {
      finished = true;
      const stars = Skills.starsFor(success);
      renderTries();
      loop && loop.stop();
      Drills.showStars(host, stars, () => onDone(stars, success));
    };

    // ----- entrada -----
    let pace = { down: false, target: null };
    cv.addEventListener('pointerdown', (e) => {
      if (!S || S.state !== 'play') return;
      const p = MG.pointer(cv, e);
      cv.setPointerCapture(e.pointerId);
      if (S.pace) { pace.down = true; pace.target = MG.toWorld(S.cam, p.sx, p.sy); return; }
      kc.down(p, MG.toScreen(S.cam, S.ball.x, S.ball.y));
    });
    cv.addEventListener('pointermove', (e) => {
      if (!S) return;
      const p = MG.pointer(cv, e);
      if (S.pace) { if (pace.down) pace.target = MG.toWorld(S.cam, p.sx, p.sy); return; }
      kc && kc.move(p);
    });
    const up = () => { pace.down = false; kc && kc.up(); };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    host.querySelector('.mg-exit').onclick = () => { if (finished) return; finished = true; loop && loop.stop(); onDone(null, null); };

    // ----- passo de física -----
    const step = (dt) => {
      if (!S || S.state === 'done') return;
      S.t += dt;
      if (S.pace) return Drills.stepPace(S, pr, pace, dt, endAttempt);
      const b = S.ball;
      if (S.gk) MG.stepGK(S.gk, b, dt);
      if (S.dummies) S.dummies.forEach(d => { if (d.moving) d.x = d.bx + Math.sin(S.t * 1.3 + d.phase) * 2.5; });
      MG.stepBall(b, S.wind);
      if (S.state !== 'play' || !S.kicked) return;
      // obstáculos
      for (const w of S.wall || []) if (MG.hits(b, w, 0.35, 1.85)) { b.vx *= -0.3; b.vy *= -0.3; return endAttempt(false); }
      for (const p of S.poles || []) if (MG.hits(b, p, 0.08, 1.6)) { b.vx *= -0.4; b.vy *= -0.2; return endAttempt(false); }
      for (const d of S.dummies || []) if (MG.hits(b, d, d.target ? B.vision.radius : 0.45, 1.85)) { b.vx *= -0.3; b.vy *= -0.3; return endAttempt(!!d.target); }
      if (S.goal) {
        const r = MG.goalCheck(b, S.gk);
        if (r) return endAttempt(r === 'goal');
      }
      if (S.poles && b.y <= S.poles[0].y) {
        const [a, c] = S.poles;
        return endAttempt(b.x > Math.min(a.x, c.x) && b.x < Math.max(a.x, c.x) && b.z < 1.6);
      }
      if (S.dummies && b.y < 1) return endAttempt(false);
      if (!b.moving || b.y > S.cam.cy + 40 || Math.abs(b.x) > 40) return endAttempt(false);
    };

    // ----- desenho -----
    const draw = (dt) => {
      if (!S) return;
      kc && kc.update(dt);
      MG.drawPitch(ctx, S.cam, { goal: S.goal });
      if (S.pace) Drills.drawPace(ctx, S, look);
      else {
        const items = [];
        (S.poles || []).forEach(p => items.push({ y: p.y, d: () => Drills.drawPole(ctx, S.cam, p) }));
        (S.dummies || []).forEach(d => items.push({ y: d.y, d: () => Drills.drawDummy(ctx, S.cam, d, S.t) }));
        (S.wall || []).forEach(w => items.push({ y: w.y, d: () => MG.drawPlayer(ctx, S.cam, w.x, w.y, { shirt: '#e53935', skin: '#c98b5e', hair: '#1b1b1b' }) }));
        if (S.gk) items.push({ y: S.gk.y, d: () => MG.drawPlayer(ctx, S.cam, S.gk.x, S.gk.y, { shirt: '#fdd835', skin: '#e8b48f', hair: '#4b2e1a' }) });
        if (!S.shooter) S.shooter = { x: S.ball.x - 0.7, y: S.ball.y + 1.2 };
        items.push({ y: S.shooter.y, d: () => MG.drawPlayer(ctx, S.cam, S.shooter.x, S.shooter.y, { shirt: '#1e88e5', skin: look.skin, hair: look.hair, boot: look.boot }) });
        items.push({ y: S.ball.y, d: () => MG.drawBall(ctx, S.cam, S.ball) });
        items.sort((a, b) => a.y - b.y).forEach(i => i.d());
        if (S.goal) MG.drawGoal(ctx, S.cam, 'front');
        if (!S.kicked && kc.phase === 'idle') Drills.drawHint(ctx, S.cam, S.ball, S.t);
        MG.drawAim(ctx, S.cam, S.ball, kc);
        MG.drawEffectBar(ctx, kc);
        MG.drawWind(ctx, S.wind);
      }
      if (flash) { flash.t -= dt; ctx.save(); ctx.fillStyle = flash.color; MG.drawIconBig(ctx, flash.icon, flash.t); ctx.restore(); if (flash.t <= 0) flash = null; }
    };

    newAttempt();
    loop = MG.loop(step, draw);
    host._stop = () => { finished = true; loop && loop.stop(); };
  },

  // ----- Velocidade: chegar na linha da bola antes dela passar -----
  stepPace(S, pr, input, dt, end) {
    const me = S.me, base = 6.2 * pr.runSpeed;
    if (input.down && input.target) {
      const dx = input.target.x - me.x, dy = input.target.y - me.y, d = Math.hypot(dx, dy);
      const want = d > 0.2 ? { x: dx / d * base, y: dy / d * base } : { x: 0, y: 0 };
      const k = S.inertia ? 3.5 * dt : 1;   // inércia nos níveis altos
      me.vx += (want.x - me.vx) * Math.min(1, k); me.vy += (want.y - me.vy) * Math.min(1, k);
      if (d < 0.3) { me.vx *= 0.5; me.vy *= 0.5; }
    } else { me.vx *= S.inertia ? 0.93 : 0.6; me.vy *= S.inertia ? 0.93 : 0.6; }
    me.x += me.vx * dt; me.y += me.vy * dt;
    for (const b of S.balls) {
      if (b.gone) continue;
      if (S.t < b.delay) continue;
      b.x += b.vx * dt;
      if (S.state !== 'play') continue;
      if (Math.hypot(b.x - me.x, b.y - me.y) < 0.85) {
        if (b.fake) { b.gone = true; continue; }
        b.vx = 0; return end(true);
      }
      if (!b.fake && Math.abs(b.x) > 27) return end(false);
    }
  },
  drawPace(ctx, S, look) {
    const cam = S.cam;
    // trajetória fantasma da bola real (alvo mostrado visualmente)
    const real = S.balls[0];
    if (S.t < 1.2 && S.state === 'play') {
      ctx.setLineDash([8, 10]); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
      const a = MG.toScreen(cam, -26, real.y), b = MG.toScreen(cam, 26, real.y);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); ctx.setLineDash([]);
    }
    const passer = MG.toScreen(cam, -S.dir * 26, real.y);
    void passer;
    MG.drawPlayer(ctx, cam, S.me.x, S.me.y, { shirt: '#1e88e5', skin: look.skin, hair: look.hair, boot: look.boot, ring: '#ffeb3b' });
    S.balls.forEach(b => { if (!b.gone && S.t >= b.delay) { ctx.globalAlpha = b.fake ? 0.8 : 1; MG.drawBall(ctx, cam, b); ctx.globalAlpha = 1; } });
  },
  drawPole(ctx, cam, p) {
    const a = MG.toScreen(cam, p.x, p.y, 0), b = MG.toScreen(cam, p.x, p.y, 1.6);
    ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    ctx.strokeStyle = '#e53935'; ctx.lineWidth = 5; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); ctx.setLineDash([]);
  },
  drawDummy(ctx, cam, d, t) {
    const s = MG.toScreen(cam, d.x, d.y), r = Math.max(6, 0.45 * cam.ppm);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(s[0], s[1] + 2, r, r * 0.45, 0, 0, 7); ctx.fill();
    ctx.fillStyle = d.target ? '#b0bec5' : '#6d7a80';
    ctx.fillRect(s[0] - r * 0.7, s[1] - r * 3.2, r * 1.4, r * 3.2);
    ctx.beginPath(); ctx.arc(s[0], s[1] - r * 3.6, r * 0.6, 0, 7); ctx.fill();
    if (d.target) {   // alvo piscando
      ctx.strokeStyle = `rgba(255,235,59,${0.5 + 0.5 * Math.sin(t * 8)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(s[0], s[1] - r * 1.8, r * 2.2, 0, 7); ctx.stroke();
    }
  },
  // mão fantasma mostrando o gesto de arrastar
  drawHint(ctx, cam, b, t) {
    if (t > 3) return;
    const s = MG.toScreen(cam, b.x, b.y), k = (t % 1.5) / 1.5;
    ctx.globalAlpha = 0.8 * (1 - k); ctx.font = '34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('👆', s[0] + 46 + k * 10, s[1] + 40 - k * 90); ctx.globalAlpha = 1;
  },

  showStars(host, stars, cb) {
    const ov = document.createElement('div');
    ov.className = 'stars-overlay';
    ov.innerHTML = `<div class="big-stars">${[0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}" style="animation-delay:${i * 0.25}s">★</span>`).join('')}</div>
      <button class="btn-main" id="stars-ok">✔</button>`;
    host.appendChild(ov);
    Sound.play(stars ? 'star' : 'bad');
    ov.querySelector('#stars-ok').onclick = () => cb();
  },
};

// Lances jogáveis da partida: interceptação, passe no meio-campo e jogada de ataque.
// Você controla só o seu jogador; companheiros e adversários são robôs.
var Moments = {
  run(host, type, g, ctxInfo, onDone) {
    const pr = Skills.params(g), look = g.player.look;
    const q = Util.clamp(ctxInfo.oppStrength / 100, 0.15, 0.95);   // dificuldade vem da força do adversário
    const myColors = ctxInfo.myColors, oppColors = ctxInfo.oppColors;
    host.innerHTML = `
      <canvas id="mm-canvas" width="${MG.W}" height="${MG.H}"></canvas>
      <div class="mg-hud"><div class="mm-type">${{ intercept: '🛡', pass: '🔁', attack: '⚽' }[type]}</div>
        <div class="mg-speed">${UI.speedPicker()}</div></div>
      <div id="mm-cards" class="mm-cards"></div>`;
    const cv = host.querySelector('#mm-canvas'), ctx = cv.getContext('2d');
    let S, kc = null, loop, done = false, stamp = null, flash = null;
    const input = { down: false, target: null };

    const finish = (res, icon) => {
      if (done) return;
      done = true;
      flash = { icon: icon || (res.ok || res.result === 'goal' || res.result === 'assist' ? '✔' : '✖'), t: 1.3 };
      Sound.play(flash.icon === '✔' ? 'good' : 'bad');
      setTimeout(() => { loop.stop(); onDone(res); }, 1500);
    };

    // ---------- montar cena ----------
    if (type === 'intercept') {
      const L = Util.clamp(q * 60, 5, 55);
      S = Drills.setup.pace(L, BALANCE.minigame);
      S.t = 0; S.state = 'play';
    } else if (type === 'pass') {
      S = Moments.setupPass(pr, q);
    } else {
      S = Moments.setupAttack(pr, q);
    }
    MG.debug = { get S() { return S; }, get kc() { return kc; } };
    if (!S.pace) {
      kc = MG.KickControl({ pr, onKick: (ang, power, curve) => { MG.kick(S.ball, ang, power, curve, pr); S.kicked = true; S.from = { x: S.ball.x, y: S.ball.y }; S.cardsEl && (S.cardsEl.innerHTML = ''); } });
    }

    // atalhos de passe (cartões na base)
    if (type === 'pass' || type === 'attack') {
      const el = host.querySelector('#mm-cards');
      S.cardsEl = el;
      const cards = S.mates.slice().sort((a, b) => Moments.openness(S, b) - Moments.openness(S, a)).slice(0, 3);
      el.innerHTML = cards.map((m, i) => `<button class="mate-card" data-i="${S.mates.indexOf(m)}" data-tip="${STR.icons.passes}"><span class="mc-shirt" style="background:${myColors[0]};color:${myColors[1]}">${m.num}</span></button>`).join('');
      el.querySelectorAll('.mate-card').forEach(b => b.onclick = () => {
        if (S.kicked || done) return;
        const m = S.mates[+b.dataset.i];
        kc.kickTo({ x: m.x, y: m.y - 0.5 }, S.ball);
      });
    }

    // ---------- entrada ----------
    cv.addEventListener('pointerdown', (e) => {
      if (done) return;
      const p = MG.pointer(cv, e); cv.setPointerCapture(e.pointerId);
      if (S.pace) { input.down = true; input.target = MG.toWorld(S.cam, p.sx, p.sy); return; }
      kc.down(p, MG.toScreen(S.cam, S.ball.x, S.ball.y));
    });
    cv.addEventListener('pointermove', (e) => {
      const p = MG.pointer(cv, e);
      if (S.pace) { if (input.down) input.target = MG.toWorld(S.cam, p.sx, p.sy); return; }
      kc.move(p);
    });
    const up = () => { input.down = false; kc && kc.up(); };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

    // ---------- física ----------
    const step = (dt) => {
      if (done && !S.ball) return;
      S.t = (S.t || 0) + dt;
      if (S.pace) {
        if (!done) Drills.stepPace(S, pr, input, dt, (ok) => { S.state = 'end'; finish({ type: 'intercept', ok }); });
        return;
      }
      Moments.stepWorld(S, dt, q, pr);
      if (done) return;
      const b = S.ball;
      // marcação chega antes do chute
      if (!S.kicked && S.presser && Math.hypot(S.presser.x - b.x, S.presser.y - b.y) < 0.9) {
        return finish(type === 'pass' ? { type, ok: false } : { type, result: 'lost' });
      }
      if (!S.kicked) return;
      // adversários interceptam bola baixa
      for (const o of S.opps) if (MG.hits(b, o, 0.45, 1.9) && Math.hypot(b.x - S.from.x, b.y - S.from.y) > 1.5) {
        b.vx *= -0.2; b.vy *= -0.2;
        return finish(type === 'pass' ? { type, ok: false } : { type, result: 'lost' });
      }
      // companheiro recebe
      for (const m of S.mates) {
        if (Math.hypot(b.x - m.x, b.y - m.y) < 1.0 && b.z < 1.8 && Math.hypot(b.x - S.from.x, b.y - S.from.y) > 2) {
          b.moving = false; b.vx = b.vy = b.vz = 0;
          if (m.offside) { m.showFlag = true; return finish(type === 'pass' ? { type, ok: false } : { type, result: 'lost' }, '🚩'); }
          const dist = Math.hypot(m.x - S.from.x, m.y - S.from.y);
          if (type === 'pass') {
            const backwards = m.y > S.from.y + 1;
            const cls = Match.passClass(dist, backwards);
            stamp = { text: STR.passWords[cls], t: 1.6 };
            return finish({ type, ok: true, dist, backwards });
          }
          // jogada de ataque: o companheiro finaliza
          const chance = BALANCE.match.assistGoalChance * (1.1 - q * 0.5) * (m.y < 12 ? 1.1 : 0.8);
          const scored = RNG.chance(chance);
          return finish({ type, result: scored ? 'assist' : 'saved' }, scored ? '✔' : '🧤');
        }
      }
      if (type === 'attack') {
        if (S.gk) MG.stepGK(S.gk, b, dt);
        const r = MG.goalCheck(b, S.gk);
        if (r) {
          const greedy = S.from.y > 25 && S.mates.some(m => m.y < S.from.y - 6 && Moments.openness(S, m) > 3);
          return finish({ type, result: r === 'goal' ? 'goal' : r === 'saved' ? 'saved' : 'miss', greedy }, r === 'goal' ? '✔' : r === 'saved' ? '🧤' : '✖');
        }
      }
      if (!b.moving || Math.abs(b.x) > 34 || b.y > S.cam.cy + 40 || b.y < -3) return finish(type === 'pass' ? { type, ok: false } : { type, result: 'miss' });
    };

    // ---------- desenho ----------
    const draw = (dt) => {
      kc && kc.update(dt);
      MG.drawPitch(ctx, S.cam, { goal: type === 'attack', half: type === 'pass' });
      if (S.pace) Drills.drawPace(ctx, S, look);
      else {
        const items = [];
        S.opps.forEach(o => items.push({ y: o.y, d: () => MG.drawPlayer(ctx, S.cam, o.x, o.y, { shirt: oppColors[0], trim: oppColors[1], skin: '#c98b5e', hair: '#1b1b1b' }) }));
        const best = Moments.bestMate(S);
        S.mates.forEach(m => items.push({ y: m.y, d: () => MG.drawPlayer(ctx, S.cam, m.x, m.y, { shirt: myColors[0], trim: myColors[1], skin: '#e8b48f', hair: '#4b2e1a', balloon: !S.kicked && m === best, flag: (pr.seeOffside && m.offside) || m.showFlag }) }));
        if (S.gk) items.push({ y: S.gk.y, d: () => MG.drawPlayer(ctx, S.cam, S.gk.x, S.gk.y, { shirt: '#fdd835', skin: '#e8b48f', hair: '#4b2e1a' }) });
        items.push({ y: S.me.y, d: () => MG.drawPlayer(ctx, S.cam, S.me.x, S.me.y, { shirt: myColors[0], trim: myColors[1], skin: look.skin, hair: look.hair, boot: look.boot, ring: '#ffeb3b' }) });
        items.push({ y: S.ball.y, d: () => MG.drawBall(ctx, S.cam, S.ball) });
        items.sort((a, b) => a.y - b.y).forEach(i => i.d());
        if (type === 'attack') MG.drawGoal(ctx, S.cam, 'front');
        if (!S.kicked && kc.phase === 'idle') Drills.drawHint(ctx, S.cam, S.ball, S.t || 0);
        MG.drawAim(ctx, S.cam, S.ball, kc);
        MG.drawEffectBar(ctx, kc);
        // relógio da marcação
        if (!S.kicked && S.presser) Moments.drawPressure(ctx, S);
      }
      if (stamp) { stamp.t -= dt; MG.drawStamp(ctx, stamp.text, stamp.t); if (stamp.t <= 0) stamp = null; }
      if (flash) { flash.t -= dt; MG.drawIconBig(ctx, flash.icon, flash.t); if (flash.t <= 0) flash = null; }
    };
    loop = MG.loop(step, draw);
    host._stop = () => { done = true; loop.stop(); };
  },

  // ---------- cenas ----------
  setupPass(pr, q) {
    const me = { x: RNG.range(-12, 12), y: 44 };
    const ball = MG.ball(me.x, me.y - 0.8);
    const lastLine = RNG.range(14, 20);   // linha do último defensor (impedimento)
    const mates = [];
    for (let i = 0; i < pr.mates; i++) {
      const fwd = i < 2 ? RNG.range(12, 30) : RNG.range(-4, 22);
      const x = Util.clamp(me.x + RNG.range(-24, 24), -30, 30), y = Util.clamp(me.y - fwd, 8, 52);
      mates.push({ x, y, hx: x, hy: y, num: [7, 8, 9, 10, 11][i], offside: false });
    }
    // às vezes um atacante está impedido
    if (RNG.chance(0.45)) { const m = mates[0]; m.y = m.hy = lastLine - RNG.range(1.5, 4); m.offside = true; }
    const opps = mates.map((m, i) => ({ x: (m.x + me.x) / 2 + RNG.range(-4, 4), y: (m.y + me.y) / 2 + RNG.range(-3, 3), mark: i, ph: RNG.range(0, 6) }));
    opps.push({ x: me.x + RNG.range(-6, 6), y: me.y - 9, presser: true, ph: 0 });
    const S = { ball, me, mates, opps, lastLine, cam: MG.fit(-34, me.y - 40, 34, me.y + 6), t: 0 };
    S.presser = opps[opps.length - 1];
    return S;
  },
  setupAttack(pr, q) {
    const me = { x: RNG.range(-14, 14), y: RNG.range(17, 26) };
    const ball = MG.ball(me.x, me.y - 0.8);
    const mates = [];
    const nm = Math.max(1, Math.min(2, pr.mates - 2));
    for (let i = 0; i < nm; i++) { const x = RNG.range(-10, 10), y = RNG.range(7, 13); mates.push({ x, y, hx: x, hy: y, num: [9, 11][i] }); }
    const opps = [];
    const nd = q > 0.55 ? 3 : 2;
    for (let i = 0; i < nd; i++) opps.push({ x: me.x + RNG.range(-8, 8), y: RNG.range(6, me.y - 4), mark: i % mates.length, ph: RNG.range(0, 6) });
    opps.push({ x: me.x + RNG.range(-5, 5), y: me.y - 7, presser: true, ph: 0 });
    const S = { ball, me, mates, opps, gk: MG.gk(Util.clamp(q * 0.9 + 0.1, 0.2, 0.9)), cam: MG.fit(-24, -4, 24, me.y + 7), t: 0 };
    S.presser = opps[opps.length - 1];
    return S;
  },

  // movimento dos robôs
  stepWorld(S, dt, q, pr) {
    const b = S.ball, oppSpeed = 2.2 + q * 3.2;
    const move = (o, tx, ty, sp) => { const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy); if (d > 0.05) { const k = Math.min(sp * dt, d) / d; o.x += dx * k; o.y += dy * k; } };
    S.opps.forEach(o => {
      if (o.presser) {
        // a marcação demora um pouco e depois aperta: esperar demais custa a bola
        const sp = S.t < 1.8 ? 0.4 : oppSpeed * 0.75;
        if (!S.kicked) move(o, S.ball.x, S.ball.y, sp); else move(o, b.x, b.y, oppSpeed * 0.5);
        return;
      }
      const m = S.mates[o.mark] || S.mates[0];
      // fecha a linha de passe, mas oscila (esperar pode abrir espaço)
      const k = 0.45 + 0.3 * Math.sin(S.t * 0.9 + o.ph);
      let tx = S.me.x + (m.x - S.me.x) * k, ty = S.me.y + (m.y - S.me.y) * k;
      if (S.kicked && Math.hypot(b.x - o.x, b.y - o.y) < 6) { tx = b.x; ty = b.y; }
      move(o, tx, ty, oppSpeed * (S.kicked ? 1 : 0.6));
    });
    S.mates.forEach(m => {
      if (S.kicked && b.moving && Math.hypot(b.x - m.x, b.y - m.y) < 6) {   // vai buscar a bola quando ela chega perto
        const v2 = b.vx * b.vx + b.vy * b.vy || 1;
        const t = Util.clamp(((m.x - b.x) * b.vx + (m.y - b.y) * b.vy) / v2, 0, 1.2);
        move(m, b.x + b.vx * t, b.y + b.vy * t, 5);
      } else if (!S.kicked) {
        move(m, m.hx + Math.sin(S.t * 0.7 + m.num) * 1.5, m.hy + Math.cos(S.t * 0.5 + m.num) * 1.0, 1.5);
      }
    });
    if (S.kicked) MG.stepBall(b, null);
  },

  openness(S, m) { return Math.min(...S.opps.map(o => Moments.segDist(o, S.me, m)), 20); },
  bestMate(S) {
    let best = null, bs = -1e9;
    S.mates.forEach(m => { const sc = Moments.openness(S, m) * 2 - m.y * 0.15 - (m.offside ? 50 : 0); if (sc > bs) { bs = sc; best = m; } });
    return best;
  },
  segDist(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y, l2 = vx * vx + vy * vy || 1;
    const t = Util.clamp(((p.x - a.x) * vx + (p.y - a.y) * vy) / l2, 0, 1);
    return Math.hypot(p.x - (a.x + vx * t), p.y - (a.y + vy * t));
  },
  drawPressure(ctx, S) {
    const d = Math.hypot(S.presser.x - S.ball.x, S.presser.y - S.ball.y);
    const k = Util.clamp(1 - (d - 0.9) / 9, 0, 1);
    const s = MG.toScreen(S.cam, S.me.x, S.me.y);
    ctx.strokeStyle = k > 0.6 ? '#ff5252' : '#ffeb3b'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(s[0], s[1] - 50, 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - k)); ctx.stroke();
  },
};

// Base da interface: palco 16:9 em tela cheia, componentes, animações de valor, toque longo, ajuda e som.
var UI = {
  stage() { return document.getElementById('stage'); },
  scale: 1,

  fitStage() {
    const st = UI.stage();
    const vw = window.innerWidth, vh = window.innerHeight;
    UI.scale = Math.min(vw / MG.W, vh / MG.H);
    st.style.transform = `translate(-50%, -50%) scale(${UI.scale})`;
    document.getElementById('rotate').hidden = !(vh > vw * 1.05);
  },

  // tela cheia + paisagem (o navegador pode recusar; tudo bem)
  goFullscreen() {
    const el = document.documentElement;
    try {
      const r = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
      if (r && r.catch) r.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* ignora */ } }).catch(() => {});
    } catch (e) { /* ignora */ }
  },

  // troca de tela: conteúdo + botão "?" fixo
  show(html, helpKey) {
    const st = UI.stage();
    if (st._screen && st._screen._stop) st._screen._stop();
    st.innerHTML = `<div class="screen">${html}</div><button class="help-btn ${Help.isNew(helpKey) ? 'pulse' : ''}" id="help-btn" data-tip="${STR.icons.help}">?</button>`;
    st._screen = st.firstElementChild;
    st._screen.dataset.help = helpKey || '';
    st.querySelector('#help-btn').onclick = () => Help.open(st._screen.dataset.help || helpKey);
    return st._screen;
  },

  // ---------- componentes ----------
  bar(v, max, color, id, extraCls = '') {
    return `<div class="bar ${extraCls}" ${id ? `id="${id}"` : ''} data-v="${v}" data-max="${max}"><div class="bar-fill" style="width:${Util.clamp(v / max * 100, 0, 100)}%;background:${color}"></div></div>`;
  },
  vbar(v, color, id, icon, tip) {
    return `<div class="vbar-wrap" ${id ? `id="${id}"` : ''} data-tip="${tip}"><div class="vbar"><div class="vbar-fill" style="height:${Util.clamp(v, 0, 100)}%;background:${color}"></div></div><span class="vbar-icon">${icon}</span></div>`;
  },
  setBar(el, v, max) {
    if (!el) return;
    const f = el.querySelector('.bar-fill, .vbar-fill');
    const pct = Util.clamp(v / (max || 100) * 100, 0, 100) + '%';
    if (f.classList.contains('vbar-fill')) f.style.height = pct; else f.style.width = pct;
  },
  crest(c, size = 56) {
    const s = size, sh = c.shape;
    const path = sh === 'round' ? `<circle cx="50" cy="50" r="46"/>`
      : sh === 'diamond' ? `<path d="M50 4 L96 50 L50 96 L4 50 Z"/>`
      : sh === 'square' ? `<rect x="8" y="8" width="84" height="84" rx="14"/>`
      : `<path d="M10 8 H90 V48 C90 74 70 88 50 96 C30 88 10 74 10 48 Z"/>`;
    return `<svg class="crest" width="${s}" height="${s}" viewBox="0 0 100 100" data-tip="${Util.esc(c.name)}">
      <g fill="${c.c1}" stroke="${c.c2}" stroke-width="6">${path}</g>
      <path d="M30 28 H70 V40 H30Z" fill="${c.c2}" opacity=".85"/>
      <text x="50" y="72" font-size="26" font-weight="900" text-anchor="middle" fill="${c.c2}" font-family="Arial Black, sans-serif">${Util.esc(c.short)}</text></svg>`;
  },
  avatar(look, size = 48, gender = 'm') {
    const s = size, longHair = gender === 'f';
    return `<svg class="avatar" width="${s}" height="${s}" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="#1d2b3a"/>
      <path d="M18 100 C20 74 34 66 50 66 C66 66 80 74 82 100 Z" fill="#1e88e5"/>
      ${longHair ? `<path d="M26 44 C24 70 30 78 36 80 L64 80 C70 78 76 70 74 44 Z" fill="${look.hair}"/>` : ''}
      <circle cx="50" cy="44" r="22" fill="${look.skin}"/>
      <path d="M28 40 C28 22 40 16 50 16 C62 16 74 22 72 40 C66 30 58 28 50 28 C42 28 34 30 28 40 Z" fill="${look.hair}"/>
      <circle cx="42" cy="46" r="2.6" fill="#222"/><circle cx="58" cy="46" r="2.6" fill="#222"/>
      <path d="M43 55 Q50 60 57 55" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
  },
  stars5(rating) {   // nota 0..10 como 5 estrelas meio-a-meio
    let h = '';
    for (let i = 0; i < 5; i++) {
      const v = rating / 2 - i;
      h += `<span class="star5 ${v >= 1 ? 'full' : v >= 0.5 ? 'half' : ''}">★</span>`;
    }
    return h;
  },
  speedPicker() {
    const k = MG.speedKey();
    return `<div class="speed-pick" data-tip="${STR.icons.speed}">${[['slow', '🐢'], ['normal', '▶'], ['fast', '⏩']].map(([v, i]) =>
      `<button class="${k === v ? 'on' : ''}" onclick="MG.setSpeed('${v}');this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${i}</button>`).join('')}</div>`;
  },

  // ---------- feedback de valor (+3 verde sobe, −2 vermelho desce) ----------
  float(target, text, positive, opts = {}) {
    const st = UI.stage(), el = typeof target === 'string' ? st.querySelector(target) : target;
    if (!el) return;
    const r = el.getBoundingClientRect(), sr = st.getBoundingClientRect();
    const x = (r.left + r.width / 2 - sr.left) / UI.scale, y = (r.top - sr.top) / UI.scale;
    const f = document.createElement('div');
    f.className = 'float ' + (positive ? 'up' : 'down');
    f.textContent = text;
    f.style.left = x + 'px'; f.style.top = (y + (opts.dy || 0)) + 'px';
    st.appendChild(f);
    setTimeout(() => f.remove(), 1600);
  },
  // anima uma barra até o novo valor e mostra o número flutuante
  animateBar(sel, from, to, max, fmt) {
    const el = typeof sel === 'string' ? UI.stage().querySelector(sel) : sel;
    if (!el) return;
    UI.setBar(el, from, max);
    requestAnimationFrame(() => requestAnimationFrame(() => UI.setBar(el, to, max)));
    const d = Math.round(to - from);
    if (d) UI.float(el, (d > 0 ? '+' : '') + (fmt ? fmt(d) : d), d > 0);
  },

  toast(icon, label) {
    const st = UI.stage(), t = document.createElement('div');
    t.className = 'toast'; t.innerHTML = `<span>${icon}</span>${label ? `<small>${Util.esc(label)}</small>` : ''}`;
    st.appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 1800);
  },
  popup(html, opts = {}) {
    UI.closePopup();
    const st = UI.stage(), p = document.createElement('div');
    p.className = 'popup-bg'; p.id = 'popup';
    p.innerHTML = `<div class="popup ${opts.cls || ''}">${html}</div>`;
    if (!opts.locked) p.addEventListener('click', e => { if (e.target === p) UI.closePopup(); });
    st.appendChild(p);
    return p;
  },
  closePopup() { const p = document.getElementById('popup'); if (p) p.remove(); },
  confirm(icon, onYes) {
    UI._yes = onYes;
    UI.popup(`<div class="pop-icon">${icon}</div><div class="row-center"><button class="btn-round" onclick="UI.closePopup()">✖</button><button class="btn-round main" onclick="UI.closePopup();UI._yes()">✔</button></div>`);
  },

  // toque longo mostra o nome do ícone
  initLongPress() {
    let timer = null, tip = null;
    const clear = () => { clearTimeout(timer); if (tip) { tip.remove(); tip = null; } };
    document.addEventListener('pointerdown', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      clear();
      if (!el) return;
      timer = setTimeout(() => {
        const st = UI.stage(), r = el.getBoundingClientRect(), sr = st.getBoundingClientRect();
        tip = document.createElement('div'); tip.className = 'tip'; tip.textContent = el.dataset.tip;
        tip.style.left = ((r.left + r.width / 2 - sr.left) / UI.scale) + 'px';
        tip.style.top = ((r.top - sr.top) / UI.scale - 8) + 'px';
        st.appendChild(tip);
      }, 450);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => setTimeout(clear, ev === 'pointerup' ? 900 : 0)));
    // no computador, passar o mouse também mostra o nome
    document.addEventListener('mouseover', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && !el.title) el.title = el.dataset.tip; });
  },
};

// ---------- ajuda "?" com balões apontando para os elementos ----------
var Help = {
  seenKey: 'rag2_help_seen',
  isNew(key) { try { return key && !(JSON.parse(localStorage.getItem(Help.seenKey) || '{}')[key]); } catch (e) { return false; } },
  markSeen(key) { try { const s = JSON.parse(localStorage.getItem(Help.seenKey) || '{}'); s[key] = 1; localStorage.setItem(Help.seenKey, JSON.stringify(s)); } catch (e) { /* ignora */ } },
  open(key) {
    const st = UI.stage(), items = STR.help[key] || [];
    Help.markSeen(key);
    MG.paused = true;
    const btn = st.querySelector('#help-btn'); if (btn) btn.classList.remove('pulse');
    const ov = document.createElement('div'); ov.className = 'help-ov';
    const sr = st.getBoundingClientRect();
    let html = '';
    items.forEach(([sel, text]) => {
      const el = st.querySelector(sel);
      if (!el || !el.getClientRects().length) return;
      const r = el.getBoundingClientRect();
      const x = (r.left + r.width / 2 - sr.left) / UI.scale, top = (r.top - sr.top) / UI.scale, bottom = (r.bottom - sr.top) / UI.scale;
      const below = top < MG.H / 2;
      const bx = Util.clamp(x, 130, MG.W - 130);
      html += `<div class="hl" style="left:${(r.left - sr.left) / UI.scale - 4}px;top:${top - 4}px;width:${r.width / UI.scale + 8}px;height:${r.height / UI.scale + 8}px"></div>
        <div class="balloon ${below ? 'below' : 'above'}" style="left:${bx}px;top:${below ? bottom + 14 : top - 14}px">${Util.esc(text)}</div>`;
    });
    const more = STR.more[key];
    ov.innerHTML = html + (more ? `<button class="help-more" id="help-more">📖</button>` : '');
    ov.addEventListener('click', (e) => {
      if (e.target.id === 'help-more') { ov.innerHTML = `<div class="help-page">${Util.esc(more)}</div>`; return; }
      ov.remove(); MG.paused = false;
    });
    st.appendChild(ov);
    // afasta balões que ficaram um em cima do outro
    const placed = [];
    ov.querySelectorAll('.balloon').forEach(bl => {
      let r = Help.rect(bl), guard = 0;
      while (placed.some(p => Help.overlap(p, r)) && guard++ < 12) {
        const dy = bl.classList.contains('above') ? -(r.h + 8) : r.h + 8;
        bl.style.top = (parseFloat(bl.style.top) + dy) + 'px';
        r = Help.rect(bl);
      }
      if (r.y + r.h > MG.H - 4) bl.style.top = (parseFloat(bl.style.top) - (r.y + r.h - MG.H + 4)) + 'px';
      if (r.y < 4) bl.style.top = (parseFloat(bl.style.top) + 4 - r.y) + 'px';
      placed.push(Help.rect(bl));
    });
  },
  rect(el) {
    const sr = UI.stage().getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: (r.left - sr.left) / UI.scale, y: (r.top - sr.top) / UI.scale, w: r.width / UI.scale, h: r.height / UI.scale };
  },
  overlap(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; },
};

// ---------- som simples (Web Audio) e vibração ----------
var Sound = {
  ctx: null,
  muted() { try { return localStorage.getItem('rag2_mute') === '1'; } catch (e) { return false; } },
  toggle() { try { localStorage.setItem('rag2_mute', Sound.muted() ? '0' : '1'); } catch (e) { /* ignora */ } },
  play(kind) {
    if (Sound.muted()) return;
    try {
      Sound.ctx = Sound.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = Sound.ctx, now = c.currentTime;
      const tone = (f, t0, dur, type = 'sine', vol = 0.15) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.setValueAtTime(f, now + t0);
        g.gain.setValueAtTime(vol, now + t0); g.gain.exponentialRampToValueAtTime(0.001, now + t0 + dur);
        o.connect(g); g.connect(c.destination); o.start(now + t0); o.stop(now + t0 + dur);
      };
      ({
        kick: () => tone(90, 0, 0.12, 'triangle', 0.3),
        good: () => { tone(660, 0, 0.12); tone(880, 0.1, 0.18); },
        bad: () => { tone(220, 0, 0.2, 'sawtooth', 0.08); },
        star: () => { tone(784, 0, 0.12); tone(988, 0.12, 0.12); tone(1318, 0.24, 0.3); },
        whistle: () => { tone(2100, 0, 0.25, 'sine', 0.1); tone(2100, 0.3, 0.5, 'sine', 0.1); },
        coin: () => { tone(1200, 0, 0.08); tone(1600, 0.07, 0.12); },
        goal: () => { tone(523, 0, 0.15); tone(659, 0.12, 0.15); tone(784, 0.24, 0.4); },
      }[kind] || (() => {}))();
    } catch (e) { /* sem áudio */ }
    if (['goal', 'bad', 'star'].includes(kind) && navigator.vibrate) { try { navigator.vibrate(kind === 'bad' ? 40 : [60, 40, 60]); } catch (e) { /* ignora */ } }
  },
};
