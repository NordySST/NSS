<title>Rumo à Glória</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #0f1720; --panel: #17222e; --panel2: #1e2c3a; --line: #2a3b4d;
  --text: #e8eef4; --muted: #8aa0b4; --accent: #2fbf71; --accent2: #1f9d5a;
  --danger: #e5484d; --gold: #f5c542; --blue: #4aa3ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 1200px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { margin: 0 0 10px; }
h3 { font-size: 16px; color: #cfe3f5; }
h4 { font-size: 14px; color: var(--muted); margin-top: 12px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .center { text-align: center; }
.hidden { display: none !important; }
input, select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; width: 100%; margin-top: 4px; }
label { display: block; margin: 10px 0; font-size: 13px; color: var(--muted); }
label.inline { display: inline-flex; gap: 6px; align-items: center; margin: 0; }
label.inline input, label.inline select { width: auto; margin: 0; }

.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; transition: .15s; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #062312; font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: var(--accent2); }
.btn.danger { border-color: var(--danger); color: #ffb3b5; }
.btn.sm { padding: 6px 10px; font-size: 13px; } .btn.xs { padding: 3px 8px; font-size: 12px; }
.btn.big { padding: 12px 22px; font-size: 16px; margin-top: 12px; }
.btn.block { display: block; width: 100%; margin: 6px 0; text-align: left; }
.btn.active { border-color: var(--accent); color: var(--accent); }
.row { display: flex; gap: 10px; margin-top: 12px; align-items: center; } .row.wrap { flex-wrap: wrap; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.panel.narrow { max-width: 460px; margin: 40px auto; }
.panel.mini { padding: 10px; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 320px 1fr 1fr; gap: 14px; }
.grid2 > .panel, .grid3 > .panel { margin: 0; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.kv .bar { width: 55%; }

.menu { text-align: center; padding-top: 30px; }
.logo .ball { font-size: 54px; } .logo h1 { font-size: 42px; letter-spacing: 1px; margin: 4px 0; }

.menu-cards { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; flex-wrap: wrap; }
.tb-left { display: flex; gap: 12px; align-items: center; }
.tb-stats { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.tb-stats > div { display: flex; flex-direction: column; min-width: 90px; }
.tb-stats .bar { width: 110px; margin-top: 4px; }
.tabs { display: flex; gap: 4px; margin: 12px 0; overflow-x: auto; }
.tab { background: transparent; border: none; color: var(--muted); padding: 9px 14px; border-radius: 8px; cursor: pointer; font: inherit; white-space: nowrap; }
.tab.active { background: var(--panel2); color: var(--text); }
.pill { background: var(--danger); color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; }
.pill.ok { background: var(--accent2); }

.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 24px; border-radius: 6px; font-size: 11px; font-weight: 800; padding: 0 5px; border: 1px solid rgba(255,255,255,.2); }
.bar { height: 9px; background: #0b121a; border-radius: 6px; overflow: hidden; }
.bar > div { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.bar.red > div { background: linear-gradient(90deg, #a52a2e, var(--danger)); }
.bar.thin { height: 6px; } .bar.thin > div { background: var(--blue); }
.o-elite { color: var(--gold); } .o-good { color: var(--accent); } .o-mid { color: #cfe3f5; } .o-low { color: var(--danger); }

.next-match .nm-teams { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 17px; margin-bottom: 6px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 6px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--muted); font-weight: 600; } .tbl .l { text-align: left; }
.tbl tr.me td { background: rgba(47,191,113,.12); }
.tbl tr.up td:first-child { border-left: 3px solid var(--accent); }
.tbl tr.down td:first-child { border-left: 3px solid var(--danger); }
.tbl tr.inj td { opacity: .6; }
.sortable { cursor: pointer; text-decoration: underline dotted; }
.scroll { overflow-x: auto; }
.nowrap { white-space: nowrap; }
.form i { display: inline-block; width: 16px; height: 16px; line-height: 16px; border-radius: 3px; font-size: 10px; font-style: normal; margin: 0 1px; color: #fff; }
.f-V { background: var(--accent2); color: #fff; padding: 1px 5px; border-radius: 4px; } .f-E { background: #6b7b8c; color: #fff; padding: 1px 5px; border-radius: 4px; } .f-D { background: var(--danger); color: #fff; padding: 1px 5px; border-radius: 4px; }
.form i.f-V, .form i.f-E, .form i.f-D { padding: 0; }
.pos { display: inline-block; width: 34px; border-radius: 4px; font-size: 11px; font-weight: 700; padding: 1px 0; text-align: center; }
.pos-GOL { background: #b58a00; } .pos-DEF { background: #1e6fd9; } .pos-MEI { background: #1f9d5a; } .pos-ATA { background: #c2412d; }

.attr-list { display: grid; gap: 8px; margin: 10px 0; }
.attr { display: grid; grid-template-columns: 110px 40px 1fr 90px; gap: 10px; align-items: center; background: var(--panel2); padding: 8px 12px; border-radius: 8px; }
.attr-val { font-weight: 800; font-size: 18px; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.shop-item { background: var(--panel2); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.shop-item.owned { opacity: .7; }
.offer { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--panel2); border-radius: 8px; margin-bottom: 8px; }
.offer > div { flex: 1; }
.msg { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }

.lu-row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.lu-row:hover { background: var(--panel2); }
.lu-row.sel { border-color: var(--gold); background: rgba(245,197,66,.1); }
.lu-row.inj { opacity: .5; }
.lu-name { flex: 1; }
#lu-pitch { width: 100%; border-radius: 8px; margin-top: 8px; }

/* Partida */
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; gap: 10px; }
.sb-team { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.sb-team.right { justify-content: flex-end; }
.sb-score { text-align: center; } .sb-score span { font-size: 34px; font-weight: 900; display: block; } .sb-score small { color: var(--gold); }
.match-body { display: grid; grid-template-columns: 1fr 340px; gap: 14px; margin-top: 14px; }
.match-main canvas { width: 100%; border-radius: 10px; display: block; }
.mv-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.mv-stats { background: var(--panel); border-radius: 10px; padding: 10px 16px; }
.srow { display: grid; grid-template-columns: 50px 1fr 50px; text-align: center; padding: 3px 0; }
.srow span { color: var(--muted); font-size: 13px; }
.match-side { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; max-height: 720px; display: flex; flex-direction: column; }
.feed { overflow-y: auto; flex: 1; font-size: 13px; }
.ev { padding: 6px 4px; border-bottom: 1px solid var(--line); }
.ev.mine { border-left: 3px solid var(--accent); padding-left: 6px; }
.ev-goal { background: rgba(245,197,66,.12); font-weight: 700; }
.ev-moment { color: var(--gold); }
.evmin { color: var(--muted); font-variant-numeric: tabular-nums; }
.kick-wrap { background: var(--panel); border-radius: 10px; padding: 10px; }
.kick-head { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--gold); }
.kick-wrap canvas { width: 100%; border-radius: 8px; touch-action: none; cursor: crosshair; display: block; }
.kick-controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.curve-val { min-width: 24px; text-align: center; font-weight: 700; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
.modal.wide { max-width: 560px; }
.final { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 17px; margin: 10px 0; flex-wrap: wrap; }
.final b { font-size: 26px; padding: 0 8px; }
.ratings { columns: 2; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--panel2); border: 1px solid var(--accent); padding: 10px 18px; border-radius: 10px; opacity: 0; transition: .25s; z-index: 60; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 900px) {
  .grid2, .grid3, .match-body { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
  .attr { grid-template-columns: 90px 36px 1fr 80px; }
  .ratings { columns: 1; }
}

/* Peneira */
.trial { max-width: 760px; margin: 0 auto; }
.trial-list { margin: 0 0 10px; padding-left: 20px; color: var(--muted); }
.trial-list li.cur { color: var(--gold); font-weight: 700; }
.trial-list li.done { color: var(--text); }
.grade { display: inline-block; min-width: 28px; text-align: center; border-radius: 6px; padding: 1px 6px; color: #fff; }
.g-A { background: #1f9d5a; } .g-B { background: #5aa832; } .g-C { background: #b58a00; } .g-D { background: #c26a2d; } .g-E { background: #a52a2e; }

</style>
<div id="app"></div>
<script>
// Utilitários gerais
const U = {
  ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; },
  rf(a, b) { return Math.random() * (b - a) + a; },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  chance(p) { return Math.random() < p; },
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  gauss(mean = 0, sd = 1) {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  },
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },
  weighted(items, weights) {
    const total = weights.reduce((s, w) => s + w, 0);
    let r = Math.random() * total;
    for (let i = 0; i < items.length; i++) {
      r -= weights[i];
      if (r <= 0) return items[i];
    }
    return items[items.length - 1];
  },
  avg(arr) { return arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0; },
  _id: 1,
  uid() { return U._id++; },
  money(n) {
    const neg = n < 0; n = Math.abs(n);
    let s;
    if (n >= 1e6) s = (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace('.', ',') + ' mi';
    else if (n >= 1e3) s = Math.round(n / 1e3) + ' mil';
    else s = Math.round(n).toString();
    return (neg ? '-' : '') + 'R$ ' + s;
  },
  esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
};

const NAMES = {
  first: ['Lucas', 'Gabriel', 'Mateus', 'Rafael', 'Pedro', 'Thiago', 'Bruno', 'Diego', 'Felipe', 'Gustavo',
    'Henrique', 'Igor', 'João', 'Leandro', 'Marcelo', 'Nicolas', 'Otávio', 'Paulo', 'Renan', 'Samuel',
    'Tiago', 'Vinícius', 'Wesley', 'Caio', 'Danilo', 'Eduardo', 'Fábio', 'Hugo', 'Júlio', 'Kauã',
    'Murilo', 'Natan', 'Raul', 'Sérgio', 'Vitor', 'André', 'Breno', 'Cristian', 'Davi', 'Enzo',
    'Fernando', 'Giovani', 'Heitor', 'Ivan', 'Luan', 'Miguel', 'Ruan', 'Yuri', 'Alan', 'Arthur',
    'Carlos', 'Daniel', 'Emanuel', 'Leo', 'Marcos', 'Rodrigo', 'Silas', 'Tomás', 'Wagner', 'Ícaro'],
  last: ['Silva', 'Santos', 'Oliveira', 'Souza', 'Lima', 'Pereira', 'Costa', 'Rodrigues', 'Almeida', 'Nascimento',
    'Araújo', 'Melo', 'Barbosa', 'Ribeiro', 'Martins', 'Carvalho', 'Rocha', 'Gomes', 'Freitas', 'Moura',
    'Cardoso', 'Teixeira', 'Correia', 'Dias', 'Pinto', 'Vieira', 'Monteiro', 'Mendes', 'Barros', 'Fonseca',
    'Campos', 'Nunes', 'Ramos', 'Moreira', 'Cavalcanti', 'Rezende', 'Farias', 'Batista', 'Macedo', 'Brito',
    'Peixoto', 'Andrade', 'Tavares', 'Coelho', 'Duarte', 'Lopes', 'Sales', 'Prado', 'Queiroz', 'Xavier'],
};

U.name = () => ({ first: U.pick(NAMES.first), last: U.pick(NAMES.last) });

// Mundo do jogo: ligas, clubes e jogadores (todos fictícios)
const POSITIONS = ['GOL', 'DEF', 'MEI', 'ATA'];
const POS_NAMES = { GOL: 'Goleiro', DEF: 'Defensor', MEI: 'Meio-campo', ATA: 'Atacante' };

const FORMATIONS = {
  '4-4-2': { DEF: 4, MEI: 4, ATA: 2 },
  '4-3-3': { DEF: 4, MEI: 3, ATA: 3 },
  '3-5-2': { DEF: 3, MEI: 5, ATA: 2 },
  '4-5-1': { DEF: 4, MEI: 5, ATA: 1 },
  '5-3-2': { DEF: 5, MEI: 3, ATA: 2 },
  '3-4-3': { DEF: 3, MEI: 4, ATA: 3 },
};

const MENTALITIES = { def: 'Defensiva', bal: 'Equilibrada', att: 'Ofensiva' };

// 30 clubes fictícios divididos em 3 divisões de 10
const TEAM_DEFS = [
  // Primeira Divisão
  ['Real Porto Alvo', 'RPA', '#c62828', '#ffffff', 88],
  ['Atlético Serrano', 'ATS', '#1565c0', '#ffffff', 85],
  ['Sport Maré Alta', 'SMA', '#111111', '#e53935', 82],
  ['União Vale Verde', 'UVV', '#2e7d32', '#ffffff', 80],
  ['Imperial da Colina', 'IMC', '#6a1b9a', '#ffd54f', 77],
  ['Ferroviário Central', 'FER', '#ef6c00', '#111111', 74],
  ['Clube Náutico Aurora', 'NAU', '#00838f', '#ffffff', 72],
  ['Esporte Clube Pinhal', 'ECP', '#33691e', '#ffeb3b', 70],
  ['Operário Bandeirante', 'OPB', '#37474f', '#ffffff', 68],
  ['Associação Rio Claro', 'ARC', '#0277bd', '#ffeb3b', 66],
  // Segunda Divisão
  ['Tupã Futebol Clube', 'TUP', '#bf360c', '#ffffff', 62],
  ['Santa Cruz do Planalto', 'SCP', '#d32f2f', '#000000', 60],
  ['Grêmio Litorâneo', 'GRL', '#283593', '#90caf9', 58],
  ['Botafogo da Serra', 'BOS', '#212121', '#ffffff', 57],
  ['Independente Cerrado', 'IND', '#f9a825', '#1b5e20', 55],
  ['Ypiranga Paulistano', 'YPI', '#7b1fa2', '#ffffff', 54],
  ['Juventude Alvorada', 'JUA', '#558b2f', '#ffffff', 52],
  ['Estrela do Norte', 'EDN', '#c2185b', '#ffffff', 51],
  ['Princesa do Vale', 'PDV', '#4e342e', '#ffcc80', 50],
  ['América das Dunas', 'AMD', '#e65100', '#fff3e0', 49],
  // Terceira Divisão
  ['Barra Funda FC', 'BFC', '#455a64', '#ff7043', 45],
  ['Comercial Ribeira', 'COR', '#1a237e', '#ffffff', 44],
  ['Esportivo Cajueiro', 'ESC', '#827717', '#ffffff', 42],
  ['Guarani da Lagoa', 'GDL', '#00695c', '#ffffff', 41],
  ['Paraná Clube Sul', 'PCS', '#0d47a1', '#e53935', 40],
  ['Vila Nova Paulista', 'VNP', '#b71c1c', '#ffffff', 39],
  ['Rio Branco Mineiro', 'RBM', '#263238', '#cfd8dc', 38],
  ['Olaria Suburbana', 'OLS', '#004d40', '#ffeb3b', 36],
  ['Canto do Rio', 'CDR', '#880e4f', '#f8bbd0', 35],
  ['Mangueiral EC', 'MEC', '#3e2723', '#a5d6a7', 33],
];

const LEAGUE_NAMES = ['Primeira Divisão', 'Segunda Divisão', 'Terceira Divisão'];

const Data = {
  makePlayer(pos, baseOvr, age) {
    const n = U.name();
    age = age || U.ri(18, 34);
    const ovr = Math.round(U.clamp(U.gauss(baseOvr, 5) - (age < 21 ? (21 - age) * 1.5 : 0), 25, 95));
    const potBonus = age < 24 ? U.ri(3, 18) : age < 28 ? U.ri(0, 5) : 0;
    const p = {
      id: U.uid(), first: n.first, last: n.last, age, pos, ovr,
      pot: Math.min(97, ovr + potBonus),
      teamId: null, fitness: 100, morale: 70, injury: 0,
      contract: U.ri(1, 4),
      s: { apps: 0, goals: 0, assists: 0, rsum: 0 },
    };
    Data.updateValue(p);
    return p;
  },

  updateValue(p) {
    const agef = p.age <= 21 ? 1.5 : p.age <= 25 ? 1.3 : p.age <= 29 ? 1.0 : p.age <= 32 ? 0.6 : 0.3;
    p.value = Math.round(Math.pow(Math.max(p.ovr - 30, 1), 2.6) * 120 * agef / 1000) * 1000;
    p.wage = Math.max(500, Math.round(Math.pow(Math.max(p.ovr - 30, 1), 2.3) * 3 / 100) * 100);
  },

  createWorld() {
    const w = {
      season: 2026, round: 0, week: 0,
      teams: {}, players: {}, leagues: [], news: [],
    };
    TEAM_DEFS.forEach((d, i) => {
      const tier = Math.floor(i / 10);
      const t = {
        id: i + 1, name: d[0], short: d[1], c1: d[2], c2: d[3], rep: d[4],
        tier, players: [],
        formation: U.pick(Object.keys(FORMATIONS)), mentality: 'bal',
        budget: Math.round(Math.pow(d[4], 2.4) * 120 / 1000) * 1000,
        stadium: Math.round(d[4] * d[4] * 6 / 1000) * 1000 + 5000,
      };
      w.teams[t.id] = t;
      const base = 40 + d[4] * 0.42;
      const comp = { GOL: 2, DEF: 7, MEI: 7, ATA: 4 };
      for (const pos in comp) {
        for (let k = 0; k < comp[pos]; k++) {
          const p = Data.makePlayer(pos, base);
          p.teamId = t.id;
          w.players[p.id] = p;
          t.players.push(p.id);
        }
      }
    });
    // agentes livres
    w.freeAgents = [];
    for (let i = 0; i < 25; i++) {
      const p = Data.makePlayer(U.pick(POSITIONS), U.ri(42, 62));
      w.players[p.id] = p; w.freeAgents.push(p.id);
    }
    for (let tier = 0; tier < 3; tier++) {
      const ids = Object.values(w.teams).filter(t => t.tier === tier).map(t => t.id);
      w.leagues.push({ tier, name: LEAGUE_NAMES[tier], teams: ids, fixtures: Data.makeFixtures(ids) });
    }
    return w;
  },

  // Turno e returno (round-robin)
  makeFixtures(ids) {
    const teams = U.shuffle(ids);
    const n = teams.length;
    const rounds = [];
    const arr = teams.slice();
    for (let r = 0; r < n - 1; r++) {
      const round = [];
      for (let i = 0; i < n / 2; i++) {
        const a = arr[i], b = arr[n - 1 - i];
        round.push(r % 2 === 0 ? { h: a, a: b, r: null } : { h: b, a: a, r: null });
      }
      rounds.push(round);
      arr.splice(1, 0, arr.pop());
    }
    const second = rounds.map(rd => rd.map(m => ({ h: m.a, a: m.h, r: null })));
    return rounds.concat(second);
  },

  leagueOf(w, teamId) { return w.leagues[w.teams[teamId].tier]; },

  table(league) {
    const rows = {};
    league.teams.forEach(id => rows[id] = { id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, form: [] });
    league.fixtures.forEach(rd => rd.forEach(m => {
      if (!m.r) return;
      const [gh, ga] = m.r;
      const H = rows[m.h], A = rows[m.a];
      H.p++; A.p++; H.gf += gh; H.ga += ga; A.gf += ga; A.ga += gh;
      if (gh > ga) { H.w++; A.l++; H.pts += 3; H.form.push('V'); A.form.push('D'); }
      else if (gh < ga) { A.w++; H.l++; A.pts += 3; A.form.push('V'); H.form.push('D'); }
      else { H.d++; A.d++; H.pts++; A.pts++; H.form.push('E'); A.form.push('E'); }
    }));
    return Object.values(rows).sort((x, y) =>
      y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || y.w - x.w);
  },

  pname(p) { return p.first + ' ' + p.last; },
  short(p) { return p.first[0] + '. ' + p.last; },
};

// Motor de simulação: escalação, partidas e temporadas
const Engine = {
  slotPos(formation, i) {
    const f = FORMATIONS[formation];
    if (i === 0) return 'GOL';
    if (i <= f.DEF) return 'DEF';
    if (i <= f.DEF + f.MEI) return 'MEI';
    return 'ATA';
  },

  available(w, pid) {
    const p = w.players[pid];
    return p && p.injury <= 0 && !p.suspended;
  },

  // Escolhe os 11 melhores para a formação e o banco (7)
  autoLineup(w, team, formation) {
    formation = formation || team.formation;
    const f = FORMATIONS[formation];
    const need = { GOL: 1, DEF: f.DEF, MEI: f.MEI, ATA: f.ATA };
    const pool = team.players.filter(id => Engine.available(w, id))
      .map(id => w.players[id])
      .sort((a, b) => Engine.eff(b) - Engine.eff(a));
    const xi = [];
    const used = new Set();
    ['GOL', 'DEF', 'MEI', 'ATA'].forEach(pos => {
      const cands = pool.filter(p => p.pos === pos && !used.has(p.id)).slice(0, need[pos]);
      cands.forEach(p => used.add(p.id));
      const slot = cands.map(p => p.id);
      // completa com qualquer jogador se faltar alguém da posição
      while (slot.length < need[pos]) {
        const any = pool.find(p => !used.has(p.id));
        if (!any) break;
        used.add(any.id); slot.push(any.id);
      }
      xi.push(...slot);
    });
    const bench = pool.filter(p => !used.has(p.id)).slice(0, 7).map(p => p.id);
    return { xi, bench };
  },

  eff(p) {
    return p.ovr * (0.7 + 0.3 * p.fitness / 100) * (0.97 + 0.06 * p.morale / 100);
  },

  slotEff(w, formation, i, pid) {
    const p = w.players[pid];
    if (!p) return 20;
    let e = Engine.eff(p);
    const sp = Engine.slotPos(formation, i);
    if (p.pos !== sp) e *= (sp === 'GOL' || p.pos === 'GOL') ? 0.45 : 0.8;
    return e;
  },

  strength(w, side) {
    const f = FORMATIONS[side.formation];
    const g = { GOL: [], DEF: [], MEI: [], ATA: [] };
    side.xi.forEach((pid, i) => {
      if (pid == null || side.off.includes(pid)) return;
      g[Engine.slotPos(side.formation, i)].push(Engine.slotEff(w, side.formation, i, pid));
    });
    const gk = g.GOL[0] || 20;
    const def = U.avg(g.DEF) || 20, mid = U.avg(g.MEI) || 20, att = U.avg(g.ATA) || 20;
    let attack = (att * 0.55 + mid * 0.35 + def * 0.1) * (1 + 0.04 * (f.ATA - 2) + 0.02 * (f.MEI - 4));
    let defense = (def * 0.55 + mid * 0.3 + gk * 0.15) * (1 + 0.04 * (f.DEF - 4));
    let midfield = mid * (1 + 0.05 * (f.MEI - 4));
    if (side.mentality === 'att') { attack *= 1.08; defense *= 0.93; }
    if (side.mentality === 'def') { attack *= 0.9; defense *= 1.08; }
    const missing = side.off.length;
    const pen = Math.pow(0.9, missing);
    return { attack: attack * pen, defense: defense * pen, midfield: midfield * pen, gk };
  },

  createMatch(w, hId, aId, opts = {}) {
    const mk = (id) => {
      const t = w.teams[id];
      let xi, bench;
      if (opts.lineups && opts.lineups[id]) ({ xi, bench } = opts.lineups[id]);
      else ({ xi, bench } = Engine.autoLineup(w, t));
      return {
        id, xi: xi.slice(), bench: bench.slice(), formation: t.formation, mentality: t.mentality,
        subs: 3, off: [], yellow: {}, used: xi.slice(), ratings: {}, ai: !(opts.userTeam === id),
      };
    };
    const m = {
      sides: [mk(hId), mk(aId)], minute: 0, score: [0, 0], events: [],
      stats: { shots: [0, 0], onT: [0, 0], poss: [0, 0] },
      exclude: opts.exclude || null, done: false, ball: 0.5, attackSide: 0,
    };
    m.sides.forEach(s => s.xi.forEach(pid => s.ratings[pid] = 6 + U.gauss(0, 0.3)));
    return m;
  },

  onPitch(m, side) { return side.xi.filter(pid => pid != null && !side.off.includes(pid)); },

  pickPlayer(w, m, sideIdx, weights, excludeIds = []) {
    const side = m.sides[sideIdx];
    const cands = Engine.onPitch(m, side).filter(pid => !excludeIds.includes(pid) && pid !== m.exclude);
    if (!cands.length) return null;
    const ws = cands.map(pid => {
      const i = side.xi.indexOf(pid);
      const pos = Engine.slotPos(side.formation, i);
      return (weights[pos] || 0) * Engine.eff(w.players[pid]) / 50;
    });
    if (ws.every(x => x === 0)) return null;
    return U.weighted(cands, ws);
  },

  ev(m, type, side, text, pid) {
    const e = { min: m.minute, type, side, text, pid };
    m.events.push(e);
    return e;
  },

  // Simula um minuto. Retorna os eventos gerados.
  step(w, m) {
    const start = m.events.length;
    m.minute++;
    const [H, A] = m.sides;
    const sh = Engine.strength(w, H), sa = Engine.strength(w, A);
    const tn = (i) => w.teams[m.sides[i].id].name;
    const pn = (pid) => Data.short(w.players[pid]);

    let ph = Math.pow(sh.midfield, 3) / (Math.pow(sh.midfield, 3) + Math.pow(sa.midfield, 3)) + 0.03;
    const s = Math.random() < ph ? 0 : 1;
    m.attackSide = s;
    m.stats.poss[s]++;
    const atk = s === 0 ? sh : sa, dfn = s === 0 ? sa : sh;
    const ratio = atk.attack / dfn.defense;
    // lances defensivos do usuário substituem parte das chances do adversário
    const pChance = U.clamp(0.22 * Math.pow(ratio, 2.2) * (s === 0 ? 1.06 : 1), 0.04, 0.5) * (m.sides[1 - s].suppress || 1);
    m.ball = s === 0 ? U.rf(0.45, 0.7) : U.rf(0.3, 0.55);

    if (Math.random() < pChance) {
      const shooter = Engine.pickPlayer(w, m, s, { ATA: 6, MEI: 3, DEF: 0.8 });
      if (shooter) {
        m.stats.shots[s]++;
        m.ball = s === 0 ? 0.88 : 0.12;
        const onT = Math.random() < U.clamp(0.38 * Math.pow(ratio, 0.6), 0.2, 0.65);
        const side = m.sides[s], opp = m.sides[1 - s];
        if (onT) {
          m.stats.onT[s]++;
          const pGoal = U.clamp(0.3 * Math.pow(Engine.eff(w.players[shooter]) / (dfn.gk || 40), 1.3), 0.12, 0.55);
          if (Math.random() < pGoal) {
            m.score[s]++;
            let assist = null;
            if (Math.random() < 0.7) assist = Engine.pickPlayer(w, m, s, { MEI: 4, ATA: 2, DEF: 1 }, [shooter]);
            side.ratings[shooter] += 1.0;
            if (assist) side.ratings[assist] += 0.6;
            Engine.onPitch(m, opp).forEach(pid => {
              const pos = Engine.slotPos(opp.formation, opp.xi.indexOf(pid));
              if (pos === 'GOL' || pos === 'DEF') opp.ratings[pid] -= 0.3;
            });
            const e = Engine.ev(m, 'goal', s,
              U.pick(['GOOOL! ', 'É GOL! ', 'Gol! ', 'Balançou a rede! ']) + pn(shooter) +
              U.pick([' bate firme e marca', ' finaliza no canto', ' toca na saída do goleiro', ' acerta um chutaço', ' cabeceia para o fundo da rede']) +
              (assist ? ' (assistência de ' + pn(assist) + ')' : '') + ' para o ' + tn(s) + '!', shooter);
            e.assist = assist;
            const st = w.players[shooter].s;
            st.goals++;
            if (assist) w.players[assist].s.assists++;
          } else {
            const gkid = opp.xi[0];
            if (gkid != null && !opp.off.includes(gkid)) opp.ratings[gkid] += 0.25;
            Engine.ev(m, 'save', s, pn(shooter) + ' finaliza, mas ' +
              (gkid != null ? pn(gkid) : 'a defesa') + U.pick([' faz grande defesa!', ' segura firme.', ' espalma para escanteio!']), shooter);
          }
        } else {
          Engine.ev(m, 'miss', s, pn(shooter) + U.pick([' chuta por cima do gol.', ' manda para fora.', ' é travado na hora do chute.', ' finaliza fraco, para fora.', ' cabeceia sem direção.']), shooter);
        }
      }
    }

    // Cartões
    if (Math.random() < 0.012) {
      const sideIdx = U.ri(0, 1), side = m.sides[sideIdx];
      const pid = Engine.pickPlayer(w, m, sideIdx, { DEF: 4, MEI: 3, ATA: 1, GOL: 0.2 });
      if (pid && pid !== m.exclude) {
        side.yellow[pid] = (side.yellow[pid] || 0) + 1;
        side.ratings[pid] -= 0.3;
        if (side.yellow[pid] >= 2) {
          side.off.push(pid); side.ratings[pid] -= 1;
          w.players[pid].suspended = 2;
          Engine.ev(m, 'red', sideIdx, 'Segundo amarelo! ' + pn(pid) + ' é expulso.', pid);
        } else Engine.ev(m, 'yellow', sideIdx, 'Cartão amarelo para ' + pn(pid) + '.', pid);
      }
    }
    // Lesões
    if (Math.random() < 0.0018) {
      const sideIdx = U.ri(0, 1), side = m.sides[sideIdx];
      const pid = Engine.pickPlayer(w, m, sideIdx, { DEF: 1, MEI: 1, ATA: 1, GOL: 0.3 });
      if (pid && pid !== m.exclude) {
        w.players[pid].injury = U.ri(1, 6);
        Engine.ev(m, 'injury', sideIdx, pn(pid) + ' se machuca e não tem condições de continuar.', pid);
        if (!Engine.aiReplace(w, m, sideIdx, pid)) side.off.push(pid);
      }
    }

    // Desgaste
    m.sides.forEach(side => Engine.onPitch(m, side).forEach(pid => {
      const p = w.players[pid];
      p.fitness = Math.max(30, p.fitness - 0.22);
    }));

    // Substituições da IA
    m.sides.forEach((side, i) => {
      if (side.ai && m.minute >= 60 && side.subs > (side.reserve || 0) && Math.random() < 0.08) {
        const tired = Engine.onPitch(m, side).filter(pid => pid !== m.exclude && side.xi.indexOf(pid) > 0)
          .sort((a, b) => w.players[a].fitness - w.players[b].fitness)[0];
        if (tired) Engine.aiReplace(w, m, i, tired);
      }
    });

    if (m.minute === 45) Engine.ev(m, 'ht', -1, 'Fim do primeiro tempo: ' + tn(0) + ' ' + m.score[0] + ' x ' + m.score[1] + ' ' + tn(1) + '.');
    if (m.minute >= 90) {
      m.done = true;
      Engine.ev(m, 'ft', -1, 'Fim de jogo! ' + tn(0) + ' ' + m.score[0] + ' x ' + m.score[1] + ' ' + tn(1) + '.');
    }
    return m.events.slice(start);
  },

  aiReplace(w, m, sideIdx, outId) {
    const side = m.sides[sideIdx];
    if (side.subs <= 0) return false;
    const slot = side.xi.indexOf(outId);
    const pos = Engine.slotPos(side.formation, slot);
    const avail = side.bench.filter(id => Engine.available(w, id) && id !== m.exclude);
    if (!avail.length) return false;
    const inId = avail.sort((a, b) =>
      (w.players[b].pos === pos) - (w.players[a].pos === pos) || Engine.eff(w.players[b]) - Engine.eff(w.players[a]))[0];
    return Engine.substitute(w, m, sideIdx, outId, inId);
  },

  substitute(w, m, sideIdx, outId, inId) {
    const side = m.sides[sideIdx];
    const slot = side.xi.indexOf(outId);
    if (slot < 0 || side.subs <= 0 || side.off.includes(outId)) return false;
    side.xi[slot] = inId;
    side.bench = side.bench.filter(id => id !== inId);
    side.subs--;
    side.used.push(inId);
    side.ratings[inId] = 6 + U.gauss(0, 0.2);
    Engine.ev(m, 'sub', sideIdx, 'Substituição no ' + w.teams[side.id].name + ': sai ' +
      Data.short(w.players[outId]) + ', entra ' + Data.short(w.players[inId]) + '.', inId);
    return true;
  },

  finish(w, m, fixture) {
    fixture.r = m.score.slice();
    m.sides.forEach((side, i) => {
      const diff = m.score[i] - m.score[1 - i];
      side.used.forEach(pid => {
        const p = w.players[pid];
        if (!p) return;
        let r = side.ratings[pid] + (diff > 0 ? 0.3 : diff < 0 ? -0.3 : 0);
        r = U.clamp(r, 3, 10);
        side.ratings[pid] = r;
        p.s.apps++; p.s.rsum += r;
        p.morale = U.clamp(p.morale + (diff > 0 ? 4 : diff < 0 ? -4 : 0) + (r - 6.5) * 2, 10, 100);
      });
    });
  },

  quick(w, fixture, opts) {
    const m = Engine.createMatch(w, fixture.h, fixture.a, opts);
    while (!m.done) Engine.step(w, m);
    Engine.finish(w, m, fixture);
    return m;
  },

  // Joga todas as partidas restantes da rodada e avança a semana
  playRound(w) {
    w.leagues.forEach(lg => {
      const rd = lg.fixtures[w.round];
      if (!rd) return;
      rd.forEach(fx => { if (!fx.r) Engine.quick(w, fx); });
    });
    // recuperação semanal
    Object.values(w.players).forEach(p => {
      p.fitness = Math.min(100, p.fitness + 28);
      if (p.injury > 0) p.injury--;
      if (p.suspended > 0) p.suspended--;
      if (!p.isUser && p.age <= 23 && p.ovr < p.pot && Math.random() < 0.06) { p.ovr++; Data.updateValue(p); }
    });
    w.round++;
    w.week++;
  },

  roundsInSeason(w) { return w.leagues[0].fixtures.length; },

  fixtureFor(w, teamId, round = w.round) {
    const lg = Data.leagueOf(w, teamId);
    const rd = lg.fixtures[round];
    return rd ? rd.find(f => f.h === teamId || f.a === teamId) : null;
  },

  endSeason(w, protect = []) {
    const summary = { season: w.season, leagues: [] };
    const tables = w.leagues.map(lg => Data.table(lg));
    tables.forEach((tb, tier) => summary.leagues.push({
      name: w.leagues[tier].name, champ: tb[0].id,
      up: tier > 0 ? [tb[0].id, tb[1].id] : [],
      down: tier < 2 ? [tb[tb.length - 1].id, tb[tb.length - 2].id] : [],
      table: tb.map(r => r.id),
    }));
    summary.leagues.forEach((L, tier) => {
      L.up.forEach(id => w.teams[id].tier = tier - 1);
      L.down.forEach(id => w.teams[id].tier = tier + 1);
    });
    // reputação acompanha a divisão
    Object.values(w.teams).forEach(t => {
      const target = [80, 55, 38][t.tier];
      t.rep = Math.round(t.rep + (target - t.rep) * 0.15);
    });
    // envelhecimento e evolução
    const retired = [];
    Object.values(w.players).forEach(p => {
      p.age++;
      p.s = { apps: 0, goals: 0, assists: 0, rsum: 0 };
      p.fitness = 100; p.injury = 0; p.suspended = 0;
      if (p.isUser) return;
      if (p.age <= 23) p.ovr = Math.min(p.pot, p.ovr + U.ri(1, 6));
      else if (p.age <= 27) p.ovr = Math.min(p.pot, p.ovr + U.ri(0, 3));
      else if (p.age >= 31) p.ovr = Math.max(25, p.ovr - U.ri(0, 4));
      p.contract--;
      Data.updateValue(p);
      if (p.age >= 34 && Math.random() < (p.age - 32) * 0.25 && !protect.includes(p.id)) retired.push(p);
    });
    retired.forEach(p => {
      if (p.teamId) {
        const t = w.teams[p.teamId];
        t.players = t.players.filter(id => id !== p.id);
      } else w.freeAgents = w.freeAgents.filter(id => id !== p.id);
      delete w.players[p.id];
    });
    // contratos vencidos de times da IA são renovados
    Object.values(w.players).forEach(p => {
      if (p.contract <= 0 && p.teamId && !protect.includes(p.teamId) && !p.isUser) p.contract = U.ri(1, 3);
    });
    // categorias de base mantêm os elencos completos
    Object.values(w.teams).forEach(t => Engine.fillSquad(w, t));
    for (let i = 0; i < 12; i++) {
      const p = Data.makePlayer(U.pick(POSITIONS), U.ri(40, 64));
      w.players[p.id] = p; w.freeAgents.push(p.id);
    }
    w.leagues.forEach((lg, tier) => {
      lg.teams = Object.values(w.teams).filter(t => t.tier === tier).map(t => t.id);
      lg.fixtures = Data.makeFixtures(lg.teams);
    });
    w.history = w.history || [];
    w.history.push({ season: w.season, champs: summary.leagues.map(L => L.champ) });
    w.season++; w.round = 0;
    return summary;
  },

  fillSquad(w, t) {
    const min = { GOL: 2, DEF: 6, MEI: 6, ATA: 3 };
    for (const pos in min) {
      let have = t.players.filter(id => w.players[id] && w.players[id].pos === pos).length;
      while (have < min[pos]) {
        const p = Data.makePlayer(pos, 36 + t.rep * 0.38, U.ri(17, 19));
        p.teamId = t.id; w.players[p.id] = p; t.players.push(p.id); have++;
      }
    }
  },

  avgRating(p) { return p.s.apps ? (p.s.rsum / p.s.apps).toFixed(1) : '-'; },
};

// Minijogo dos lances de ataque.
const Kick = {
  W: 640, H: 460,
  GOAL_Y: 22, POST_L: 268, POST_R: 372,

  // velocidade dos lances (guardada no navegador)
  SPEEDS: { lenta: 0.35, normal: 0.55, rapida: 0.85 },
  speedKey() { try { return localStorage.getItem('rag_kick_speed') || 'normal'; } catch (e) { return 'normal'; } },
  speed() { return Kick.SPEEDS[Kick.speedKey()] || 0.55; },
  setSpeed(k) { try { localStorage.setItem('rag_kick_speed', k); } catch (e) { /* ignora */ } },
  speedSelect() {
    const cur = Kick.speedKey();
    return `<label class="inline small">Velocidade do lance
      <select id="kick-speed" onchange="Kick.setSpeed(this.value)">${[['lenta', 'Lenta'], ['normal', 'Normal'], ['rapida', 'Rápida']]
        .map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${v}</option>`).join('')}</select></label>`;
  },

  CR: 70, // raio da bola grande

  // estado da bola grande no momento do toque, conforme ela chega
  contactBall(kind, bounce) {
    const W = Kick.W, ground = Kick.H - 70;
    if (kind === 'rasteira') {
      const dir = Math.random() < 0.5 ? 1 : -1;
      return { kind, x: dir > 0 ? -Kick.CR : W + Kick.CR, vx: dir * U.rf(3.2, 4.4), h: 0, vh: 0, rot: 0, ground, scale: 1 };
    }
    if (kind === 'alta') return { kind, x: W / 2 + U.rf(-90, 90), vx: U.rf(-0.6, 0.6), h: 300, vh: 0, rot: 0, ground, scale: 1 };
    if (kind === 'quicando' || bounce > 0.6) return { kind: 'quicando', x: W / 2 + U.rf(-60, 60), vx: U.rf(-0.5, 0.5), h: 90 + bounce * 4, vh: 0, rot: 0, ground, scale: 1 };
    return { kind: 'parada', x: W / 2, vx: 0, h: 0, vh: 0, rot: 0, ground, scale: 1 };
  },

  // avança a animação; retorna true se a bola passou e saiu da tela
  stepContact(c, k) {
    c.x += c.vx * k;
    c.rot += c.vx * k / Kick.CR;
    if (c.kind === 'quicando' || c.kind === 'alta') {
      c.vh -= 0.32 * k; c.h += c.vh * k;
      if (c.h <= 0) { c.h = 0; c.vh = Math.abs(c.vh) > 1.5 ? -c.vh * 0.72 : 0; }
      c.rot += 0.01 * k;
      if (c.x < 120 || c.x > Kick.W - 120) c.vx = -c.vx;
    }
    c.scale = 1 + c.h / 900;
    return c.kind === 'rasteira' && (c.x < -Kick.CR - 5 || c.x > Kick.W + Kick.CR + 5);
  },

  drawContactBall(ctx, c) {
    const R = Kick.CR * c.scale, cx = c.x, cy = c.ground - c.h - Kick.CR;
    // gramado e sombra
    ctx.fillStyle = 'rgba(47,138,60,.5)'; ctx.fillRect(0, c.ground, Kick.W, Kick.H - c.ground);
    const sh = Math.max(0.25, 1 - c.h / 400);
    ctx.beginPath(); ctx.ellipse(cx, c.ground + 4, Kick.CR * sh, 12 * sh, 0, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fillStyle = '#f4f4f4'; ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.clip();
    ctx.fillStyle = '#2b2b2b';
    const pent = (x, y, r, a0) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = a0 + i * 2 * Math.PI / 5; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); ctx.fill(); };
    pent(cx, cy, R * 0.27, c.rot - Math.PI / 2);
    for (let i = 0; i < 5; i++) { const a = c.rot - Math.PI / 2 + i * 2 * Math.PI / 5; pent(cx + Math.cos(a) * R * 0.87, cy + Math.sin(a) * R * 0.87, R * 0.22, a + Math.PI); }
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.lineWidth = 3; ctx.strokeStyle = '#222'; ctx.stroke();
  },

  drawPitch(ctx) {
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i % 2 ? '#2f8a3c' : '#2a7f36';
      ctx.fillRect(0, i * Kick.H / 10, Kick.W, Kick.H / 10);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
    ctx.strokeRect(10, Kick.GOAL_Y, Kick.W - 20, Kick.H);
    ctx.strokeRect(150, Kick.GOAL_Y, 340, 150);
    ctx.strokeRect(245, Kick.GOAL_Y, 150, 50);
    ctx.beginPath(); ctx.arc(320, Kick.GOAL_Y + 105, 3, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(320, Kick.GOAL_Y + 105, 70, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(320, Kick.H + 60, 90, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
    // gol
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.fillRect(Kick.POST_L, 4, Kick.POST_R - Kick.POST_L, Kick.GOAL_Y - 4);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    for (let x = Kick.POST_L; x <= Kick.POST_R; x += 8) { ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x, Kick.GOAL_Y); ctx.stroke(); }
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(Kick.POST_L, Kick.GOAL_Y); ctx.lineTo(Kick.POST_L, 4); ctx.lineTo(Kick.POST_R, 4); ctx.lineTo(Kick.POST_R, Kick.GOAL_Y); ctx.stroke();

  },

  dot(ctx, x, y, fill, stroke, label) {
    ctx.beginPath(); ctx.arc(x, y + 3, 11, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = stroke; ctx.stroke();
    if (label) { ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, x, y - 15); }
  },

  ball(ctx, x, y) {
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.stroke();
  },

  banner(ctx, text, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, Kick.H / 2 - 30, Kick.W, 60);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(text, Kick.W / 2, Kick.H / 2 + 10);
    ctx.globalAlpha = 1;
  },

  scenario(type, gkOvr, defOvr) {
    const R = U.rf;
    const s = { type, gk: { x: 320, y: 30, ovr: gkOvr }, defenders: [], mates: [], maxTouches: 2 };
    const def = (x, y) => s.defenders.push({ x, y, ox: x, oy: y });
    const mate = (x, y) => s.mates.push({ x, y });
    switch (type) {
      case 'chance':
        s.title = 'Chance na área!'; s.ball = { x: R(220, 420), y: R(170, 220) };
        def(s.ball.x + R(-50, 50), s.ball.y - R(45, 75));
        if (defOvr > 50) def(320 + R(-60, 60), R(80, 110));
        mate(s.ball.x < 320 ? R(400, 470) : R(170, 240), R(110, 160));
        s.maxTouches = 2; break;
      case 'contra':
        s.title = 'Contra-ataque!'; s.ball = { x: R(280, 360), y: 390 };
        mate(R(140, 220), R(200, 250)); mate(R(420, 500), R(180, 240));
        def(R(260, 380), R(270, 310)); def(R(200, 440), R(130, 170));
        s.maxTouches = 3; break;
      case 'falta': {
        s.title = 'Cobrança de falta'; s.ball = { x: R(200, 440), y: R(215, 260) };
        const d = Math.hypot(320 - s.ball.x, Kick.GOAL_Y - s.ball.y);
        const ux = (320 - s.ball.x) / d, uy = (Kick.GOAL_Y - s.ball.y) / d;
        const cx = s.ball.x + ux * 80, cy = s.ball.y + uy * 80;
        for (let k = -1; k <= 1.01; k += 1) def(cx - uy * k * 23, cy + ux * k * 23);
        s.maxTouches = 1; break;
      }
      case 'longe':
        s.title = 'Bola na entrada da área'; s.ball = { x: R(200, 440), y: R(270, 300) };
        def(s.ball.x + R(-40, 40), s.ball.y - 70); def(R(230, 410), R(120, 160)); def(R(200, 440), R(190, 220));
        mate(s.ball.x < 320 ? R(420, 480) : R(160, 220), R(140, 180));
        s.maxTouches = 2; break;
      case 'passe':
        s.title = 'Armação de jogada'; s.ball = { x: R(260, 380), y: 410 };
        mate(R(120, 200), R(260, 300)); mate(R(440, 520), R(250, 290)); mate(R(260, 380), R(160, 200));
        def(R(250, 390), R(320, 350)); def(R(180, 300), R(200, 230)); def(R(340, 460), R(190, 220));
        s.maxTouches = 3; break;
      case 'penalti':
        s.title = 'Pênalti!'; s.ball = { x: 320, y: 120 }; s.maxTouches = 1; break;
    }
    // como a bola chega até você
    const b = s.ball;
    const arrive = {
      chance: ['rasteira', 'alta', 'quicando'], contra: ['parada', 'rasteira'], longe: ['quicando', 'rasteira', 'quicando'],
      passe: ['parada', 'rasteira'], falta: ['parada'], penalti: ['parada'],
    }[type];
    s.arrive = U.pick(arrive);
    if (s.arrive === 'alta') s.from = { x: b.x < 320 ? 615 : 25, y: R(70, 200) };                 // cruzamento
    else if (s.arrive === 'quicando') s.from = { x: b.x + R(-70, 70), y: Math.max(60, b.y - R(70, 110)) }; // rebote
    else if (s.arrive === 'rasteira') {
      const m = s.mates.find(m => m.y > b.y);
      s.from = m ? { x: m.x, y: m.y } : { x: b.x + R(-120, 120), y: Kick.H - 5 };                // passe de trás
    }
    s.setpiece = type === 'falta' || type === 'penalti';
    return s;
  },

  // attrs: { chute, passe, tecnica, velocidade, energia }
  // Fluxo: 1) arraste e solte para mirar e dar força; 2) toque no ponto da bola onde quer bater
  // (lado = efeito, embaixo = bola alta, em cima = rasteira forte). Você controla só o seu jogador:
  // depois de um passe, o companheiro decide sozinho entre finalizar ou devolver a bola para você.
  start(host, sc, attrs, onDone) {
    host.innerHTML = `
      <div class="kick-wrap">
        <div class="kick-head"><b>${U.esc(sc.title)}</b><span id="kick-info"></span></div>
        <canvas id="kick-canvas" width="${Kick.W}" height="${Kick.H}"></canvas>
        <div class="kick-controls">${Kick.speedSelect()}<span id="kick-hint" class="muted small"></span></div>
      </div>`;
    const cv = host.querySelector('#kick-canvas');
    const ctx = cv.getContext('2d');
    const BAR = 26;          // altura do travessão
    const PLAYER_H = 14;     // acima disso a bola passa por cima dos jogadores
    const st = {
      me: { x: sc.ball.x, y: sc.ball.y + 14, run: null },
      ball: { x: (sc.from || sc.ball).x, y: (sc.from || sc.ball).y, z: 0, vx: 0, vy: 0, vz: 0, moving: false },
      arrKind: sc.arrive || 'parada', arr: { t: 0 }, bounce: 0, bt: 0, press: 0, cv: null,
      gk: { ...sc.gk }, defs: sc.defenders.map(d => ({ ...d })), mates: sc.mates.map(m => ({ ...m })),
      phase: sc.arrive && sc.arrive !== 'parada' ? 'arrive' : 'aim', aim: null, aiming: false, shot: null, contactT: 0,
      owner: 'me', holder: null, mateT: 0, touches: 0, passes: 0, spin: 0, lastKicker: 'me',
      over: false, msg: null, msgT: 0,
    };
    const info = host.querySelector('#kick-info');
    const hint = host.querySelector('#kick-hint');
    const updInfo = () => {
      info.textContent = `Toques: ${st.touches}/${sc.maxTouches}`;
      hint.textContent = st.phase === 'arrive' ? { rasteira: 'A bola vem rasteira até você...', alta: 'Cruzamento! A bola vem pelo alto...', quicando: 'A bola sobra quicando...' }[st.arrKind] || ''
        : st.phase === 'aim' && st.owner === 'me' ? 'Arraste para trás a partir da bola e solte para mirar. Quanto mais longe, mais força.' + (sc.setpiece ? '' : ' Não demore: a marcação chega!')
        : st.phase === 'contact' ? 'Toque no ponto da bola onde quer bater: lado = efeito, embaixo = bola alta, em cima = rasteira forte. Fora da bola = chute mascado.'
        : st.owner === 'mate' ? 'O companheiro está com a bola. Você se desloca para receber.' : '';
    };
    updInfo();

    const toLocal = (e) => {
      const r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) * Kick.W / r.width, y: (e.clientY - r.top) * Kick.H / r.height };
    };
    cv.addEventListener('pointerdown', (e) => {
      if (st.over) return;
      if (st.phase === 'contact') {
        const p = toLocal(e), c = st.cv;
        const R = Kick.CR * c.scale;
        const dx = (p.x - c.x) / R, dy = (p.y - (c.ground - c.h - Kick.CR)) / R, d = Math.hypot(dx, dy);
        lockContact({ x: d > 1 ? dx / d : dx, y: d > 1 ? dy / d : dy, h: c.h, mishit: d > 1.12 });
        return;
      }
      if (st.phase !== 'aim' || st.owner !== 'me' || st.ball.moving) return;
      cv.setPointerCapture(e.pointerId);
      st.aiming = true; st.aim = toLocal(e);
    });
    cv.addEventListener('pointermove', (e) => { if (st.aiming) st.aim = toLocal(e); });
    cv.addEventListener('pointerup', (e) => {
      if (!st.aiming) return;
      st.aiming = false;
      const p = toLocal(e);
      const dx = st.ball.x - p.x, dy = st.ball.y - p.y;
      const pow = Math.min(Math.hypot(dx, dy), 160) / 160;
      if (pow < 0.08) return;
      st.shot = { ang: Math.atan2(dy, dx), pow };
      st.cv = Kick.contactBall(st.arrKind, st.bounce);
      st.contactT = 0; st.phase = 'contact'; updInfo();
    });

    const isPassAim = (from, ang) => st.mates.some(m => {
      const vx = m.x - from.x, vy = m.y - from.y;
      if (Math.hypot(vx, vy) < 5) return false;
      const a = Math.atan2(vy, vx);
      return Math.abs(Math.atan2(Math.sin(a - ang), Math.cos(a - ang))) < 0.25;
    });

    function lockContact(c) {
      const s = st.shot, b = st.ball;
      const pass = isPassAim(b, s.ang);
      const skill = pass ? attrs.passe : attrs.chute;
      const volley = Math.min(1.5, c.h / 120); // bater com a bola no ar: mais força, menos controle
      let sd = (0.015 + (1 - attrs.tecnica / 100) * 0.06 + (1 - skill / 100) * 0.05 + (1 - attrs.energia / 100) * 0.04) * (0.6 + s.pow * 0.6) * (1 + volley * 0.7);
      let pow = s.pow;
      if (c.mishit) { pow *= 0.45; sd += 0.25; st.msg = 'Pegou mal na bola!'; st.msgT = 0; }
      const ang = s.ang + U.gauss(0, sd);
      const drive = Math.max(0, -c.y);   // em cima: mais rápida e rasteira
      const lift = Math.max(0, c.y);     // embaixo: sobe
      const sp = (5 + pow * (8 + attrs.chute / 100 * 6)) * (1 + drive * 0.12) * (1 - lift * 0.18) * (1 + volley * 0.08);
      b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
      b.z = Math.min(b.z, 4);
      b.vz = lift * (2.5 + pow * 5.5) + (drive ? 0 : 0.4) + volley * 1.2;
      b.moving = true;
      st.spin = -c.x * 3; st.bounce = 0;
      st.kickFrom = { x: b.x, y: b.y }; st.lastKicker = 'me';
      st.touches++; st.phase = 'flight'; st.owner = null;
      // você corre para um espaço depois de tocar a bola
      st.me.run = pickRun();
      updInfo();
    }

    // escolhe um espaço livre mais perto do gol para o seu jogador se deslocar
    function pickRun() {
      let best = null, bestScore = -1e9;
      for (let i = 0; i < 24; i++) {
        const x = U.rf(170, 470), y = U.rf(Math.max(90, st.me.y - 170), Math.max(100, st.me.y - 40));
        const free = Math.min(...st.defs.map(d => Math.hypot(d.x - x, d.y - y)), 200);
        const score = free * 1.2 - Math.hypot(x - 320, y - 60) * 0.6 - Math.hypot(x - st.me.x, y - st.me.y) * 0.2;
        if (score > bestScore) { bestScore = score; best = { x, y }; }
      }
      return best;
    }

    const finish = (result, msg) => {
      if (st.over) return;
      st.over = true; st.msg = msg; st.msgT = 0; st.phase = 'over';
      setTimeout(() => { cancelAnimationFrame(st.raf); onDone({ result, passes: st.passes }); }, 1900);
    };

    // o companheiro (robô) decide o que fazer com a bola
    function mateDecide() {
      const m = st.holder;
      const blocked = st.defs.some(d => {
        const t = ((d.x - m.x) * (320 - m.x) + (d.y - m.y) * (Kick.GOAL_Y - m.y)) / (Math.hypot(320 - m.x, Kick.GOAL_Y - m.y) ** 2);
        if (t < 0 || t > 1) return false;
        const px = m.x + t * (320 - m.x), py = m.y + t * (Kick.GOAL_Y - m.y);
        return Math.hypot(d.x - px, d.y - py) < 24;
      });
      const dGoal = Math.hypot(320 - m.x, Kick.GOAL_Y - m.y);
      const canReturn = st.touches < sc.maxTouches;
      const shoot = !canReturn || (dGoal < 190 && !blocked && Math.random() < 0.7) || (dGoal < 120 && Math.random() < 0.5);
      const b = st.ball;
      b.x = m.x; b.y = m.y - 12; b.z = 0;
      st.kickFrom = { x: b.x, y: b.y }; st.lastKicker = 'mate'; st.spin = 0;
      if (shoot) {
        const tx = U.rf(Kick.POST_L + 8, Kick.POST_R - 8), sp = 11 + U.rf(0, 3);
        const ang = Math.atan2(Kick.GOAL_Y - b.y, tx - b.x) + U.gauss(0, 0.07);
        b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp; b.vz = blocked ? 3 : 0.4;
        st.msg = 'O companheiro finaliza!'; st.msgT = 0;
      } else {
        const me = st.me;
        // passe na frente: onde você vai estar quando a bola chegar
        const mySp = 1.2 + attrs.velocidade / 100 * 1.6;
        const sp = 8;
        let lead = { x: me.x, y: me.y - 10 };
        for (let k = 0; k < 4; k++) {
          const t = Math.hypot(lead.x - b.x, lead.y - b.y) / (sp * 0.9);
          if (!me.run) break;
          const rx = me.run.x - me.x, ry = me.run.y - me.y, rd = Math.hypot(rx, ry);
          const go = Math.min(rd, mySp * t);
          lead = rd > 1 ? { x: me.x + rx / rd * go, y: me.y + ry / rd * go - 10 } : { x: me.x, y: me.y - 10 };
        }
        const laneBlocked = st.defs.some(df => Math.hypot(df.x - (b.x + lead.x) / 2, df.y - (b.y + lead.y) / 2) < 30);
        const ang = Math.atan2(lead.y - b.y, lead.x - b.x) + U.gauss(0, 0.05);
        b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp; b.vz = laneBlocked ? 3.2 : 0;
        st.lastPassLofted = laneBlocked;
        st.msg = 'Tabela!'; st.msgT = 0;
      }
      b.moving = true; st.owner = null; st.holder = null; st.phase = 'flight'; updInfo();
    }

    function physics() {
      const b = st.ball, g = st.gk;
      // seu jogador corre para o espaço
      // quando a bola vem do companheiro, você vai ao encontro dela
      if (!st.over && st.lastKicker === 'mate' && b.moving && st.phase === 'flight' && b.vy !== 0) {
        // vai para o ponto da trajetória da bola mais próximo de você
        const v2 = b.vx * b.vx + b.vy * b.vy;
        const t = Math.max(0, ((st.me.x - b.x) * b.vx + (st.me.y - 14 - b.y) * b.vy) / v2);
        st.me.run = { x: b.x + b.vx * t, y: b.y + b.vy * t + 14 };
      }
      if (st.me.run && !st.over) {
        const sp = 1.2 + attrs.velocidade / 100 * 1.6;
        const dx = st.me.run.x - st.me.x, dy = st.me.run.y - st.me.y, d = Math.hypot(dx, dy);
        if (d > 1) { st.me.x += dx / d * Math.min(sp, d); st.me.y += dy / d * Math.min(sp, d); }
      }
      // goleiro
      const gkSpeed = 1.4 + g.ovr / 100 * 2.4;
      let tx = b.x;
      if (b.moving && b.vy < 0) tx = b.x + b.vx * ((b.y - g.y) / -b.vy);
      tx = U.clamp(tx, Kick.POST_L + 4, Kick.POST_R - 4);
      if (!st.over) g.x += U.clamp(tx - g.x, -gkSpeed, gkSpeed);

      // a bola chegando até você
      if (st.phase === 'arrive' && !st.over) {
        const A = st.arr, kind = st.arrKind, from = sc.from, to = sc.ball;
        const T = { rasteira: 75, alta: 95, quicando: 80 }[kind];
        A.t++;
        const u = Math.min(1, A.t / T);
        const e = kind === 'rasteira' ? 1 - (1 - u) * (1 - u) : u;
        b.x = from.x + (to.x - from.x) * e; b.y = from.y + (to.y - from.y) * e;
        b.z = kind === 'alta' ? 4 * 75 * u * (1 - u) : kind === 'quicando' ? Math.abs(Math.sin(u * Math.PI * 2)) * 30 * (1 - u * 0.5) : 0;
        if (u >= 1) {
          st.phase = 'aim'; st.bounce = kind === 'alta' ? 16 : kind === 'quicando' ? 10 : 0; st.bt = 0;
          if (kind === 'rasteira') st.arrKind = 'rasteira';
          updInfo();
        }
        return;
      }
      // bola quicando no seu pé enquanto você mira
      if (st.phase === 'aim' || st.phase === 'contact') {
        if (st.bounce > 0.6) { st.bt++; b.z = st.bounce * Math.abs(Math.sin(st.bt * 0.11)); st.bounce *= 0.994; }
        else { b.z = 0; st.bounce = 0; }
      }
      if (st.phase === 'aim' && st.owner === 'me' && !sc.setpiece && !st.over) {
        st.press++;
        if (st.press > 150 && st.defs.length) {
          const near = st.defs.reduce((a, d) => (Math.hypot(d.x - st.me.x, d.y - st.me.y) < Math.hypot(a.x - st.me.x, a.y - st.me.y) ? d : a));
          near.x += U.clamp(st.me.x - near.x, -0.8, 0.8); near.y += U.clamp(st.me.y - 10 - near.y, -0.8, 0.8);
          if (Math.hypot(near.x - b.x, near.y - b.y) < 16) return finish('blocked', 'Desarmado! Você demorou.');
        }
      }
      // bola com o companheiro: marcação aperta e ele decide
      if (st.owner === 'mate' && !st.over) {
        const m = st.holder;
        const near = st.defs.reduce((a, d) => (Math.hypot(d.x - m.x, d.y - m.y) < Math.hypot(a.x - m.x, a.y - m.y) ? d : a), st.defs[0]);
        if (near) { near.x += U.clamp(m.x - near.x, -0.7, 0.7); near.y += U.clamp(m.y - near.y, -0.7, 0.7); }
        st.mateT++;
        if (st.mateT > 55) mateDecide();
        return;
      }
      if (!b.moving) return;
      const sp = Math.hypot(b.vx, b.vy);
      if (st.spin && sp > 1) {
        const k = st.spin * 0.045 * Math.min(sp, 12) / 12;
        b.vx += -b.vy / sp * k; b.vy += b.vx / sp * k;
      }
      b.x += b.vx; b.y += b.vy;
      b.z += b.vz; b.vz -= 0.22;
      if (b.z <= 0) { b.z = 0; b.vz = Math.abs(b.vz) > 1.2 ? -b.vz * 0.35 : 0; }
      const fr = b.z > 0 ? 0.992 : 0.983;
      b.vx *= fr; b.vy *= fr;
      if (st.over) { if (sp < 0.2 && b.z === 0) b.moving = false; return; }

      const low = b.z < PLAYER_H;
      // defensores reagem e bloqueiam bola baixa
      for (const d of st.defs) {
        const dist = Math.hypot(b.x - d.x, b.y - d.y);
        if (dist < 140) { d.x += U.clamp(b.x - d.x, -0.9, 0.9); d.y += U.clamp(b.y - d.y, -0.5, 0.5); }
        if (dist < 17 && low) {
          b.vx = -b.vx * 0.35 + U.rf(-1, 1); b.vy = -b.vy * 0.35;
          return finish('blocked', st.lastKicker === 'me' ? 'Bloqueado pela defesa!' : 'A defesa cortou!');
        }
      }
      const far = Math.hypot(b.x - st.kickFrom.x, b.y - st.kickFrom.y) > 25;
      // companheiro recebe o seu passe
      if (st.lastKicker === 'me' && b.z < 18 && far) {
        for (const m of st.mates) {
          if (Math.hypot(b.x - m.x, b.y - m.y) < 18) {
            b.moving = false; b.vx = b.vy = b.vz = 0; b.z = 0; b.x = m.x; b.y = m.y - 12;
            st.passes++; st.owner = 'mate'; st.holder = m; st.mateT = 0; st.phase = 'mate';
            st.msg = 'Passe certo!'; st.msgT = 0; updInfo();
            return;
          }
        }
      }
      // você recebe a devolução
      if (st.lastKicker === 'mate' && b.z < 18 && far && Math.hypot(b.x - st.me.x, b.y - st.me.y + 14) < 24) {
        b.moving = false; b.vx = b.vy = b.vz = 0; b.z = 0; b.x = st.me.x; b.y = st.me.y - 14;
        st.me.run = null; st.owner = 'me'; st.phase = 'aim'; st.press = 0;
        st.arrKind = st.lastPassLofted ? 'quicando' : 'rasteira';
        st.bounce = st.lastPassLofted ? 10 : 0; st.bt = 0;
        updInfo();
        return;
      }
      // gol / defesa / trave / fora
      if (b.y <= g.y + 6 && b.y >= g.y - 8 && b.vy < 0 && b.z < 30) {
        const reach = 16 + g.ovr / 100 * 9;
        if (Math.abs(b.x - g.x) < reach && !(sp > 12 && Math.random() < (sp - 12) * 0.07)) {
          b.vy = -b.vy * 0.4; b.vx += U.rf(-2, 2);
          return finish('saved', 'Defesa do goleiro!');
        }
      }
      if (b.y <= Kick.GOAL_Y) {
        const mine = st.lastKicker === 'me';
        if (b.z >= BAR && b.x > Kick.POST_L - 10 && b.x < Kick.POST_R + 10) return finish('miss', 'Por cima do gol!');
        if (Math.abs(b.x - Kick.POST_L) < 5 || Math.abs(b.x - Kick.POST_R) < 5 || Math.abs(b.z - BAR) < 2) {
          b.vy = -b.vy * 0.6; b.vx = -b.vx * 0.6;
          return finish('miss', 'Na trave!');
        }
        if (b.x > Kick.POST_L && b.x < Kick.POST_R) {
          b.vx *= 0.3; b.vy *= 0.3;
          return finish(mine ? 'goal' : 'assist', mine ? 'GOOOL!' : 'GOL! Assistência sua!');
        }
        return finish('miss', 'Para fora!');
      }
      if (b.x < 0 || b.x > Kick.W || b.y > Kick.H) return finish('miss', 'Bola perdida pela linha.');
      if (sp < 0.25 && b.z === 0) {
        b.moving = false;
        finish('miss', 'A bola parou. A defesa recupera.');
      }
    }

    function drawContact() {
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, Kick.W, Kick.H);
      const k = (st.rt || 1) * Kick.speed() / 0.55;
      const out = Kick.stepContact(st.cv, k);
      Kick.drawContactBall(ctx, st.cv);
      ctx.fillStyle = '#ffe27a'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText({ parada: 'Toque na bola onde quer bater', rasteira: 'A bola vem rolando: toque nela!', quicando: 'A bola está quicando: toque nela!', alta: 'Bola alta: toque nela!' }[st.cv.kind], Kick.W / 2, 30);
      ctx.fillStyle = '#cfe3f5'; ctx.font = '12px sans-serif';
      ctx.fillText('em cima = rasteira forte  •  embaixo = bola alta  •  lado esquerdo = curva p/ direita  •  lado direito = curva p/ esquerda', Kick.W / 2, Kick.H - 14);
      if (out) finish('miss', 'A bola passou por você!');
    }

    function draw() {
      Kick.drawPitch(ctx);
      const dot = (x, y, f, k, l) => Kick.dot(ctx, x, y, f, k, l);
      st.defs.forEach(d => dot(d.x, d.y, '#d84343', '#7a1010'));
      st.mates.forEach(m => dot(m.x, m.y, '#2f6fd6', '#0f2f66'));
      dot(st.gk.x, st.gk.y, '#f2c12e', '#6b5200');
      dot(st.me.x, st.me.y, '#ffffff', '#1d4ed8', 'VOCÊ');
      const b = st.ball;
      // sombra + bola (sobe com a altura)
      ctx.beginPath(); ctx.ellipse(b.x, b.y + 2, 6, 3, 0, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();
      const r = 6 + b.z * 0.08;
      ctx.beginPath(); ctx.arc(b.x, b.y - b.z, r, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.stroke();

      if (st.aiming && st.aim) {
        const dx = b.x - st.aim.x, dy = b.y - st.aim.y;
        const pow = Math.min(Math.hypot(dx, dy), 160) / 160;
        const ang = Math.atan2(dy, dx);
        ctx.setLineDash([6, 6]); ctx.lineWidth = 3;
        ctx.strokeStyle = isPassAim(b, ang) ? '#8fd3ff' : '#ffe27a';
        ctx.beginPath(); ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x + Math.cos(ang) * (40 + pow * 240), b.y + Math.sin(ang) * (40 + pow * 240));
        ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(14, Kick.H - 30, 124, 16);
        ctx.fillStyle = pow > 0.85 ? '#ff6b6b' : '#7cff8a'; ctx.fillRect(16, Kick.H - 28, 120 * pow, 12);
      }
      if (st.phase === 'aim' && st.owner === 'me' && !sc.setpiece && !st.over) {
        const left = Math.max(0, 1 - st.press / 230);
        ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(Kick.W - 138, Kick.H - 30, 124, 16);
        ctx.fillStyle = left < 0.35 ? '#ff6b6b' : '#ffe27a'; ctx.fillRect(Kick.W - 136, Kick.H - 28, 120 * left, 12);
        ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('Tempo', Kick.W - 144, Kick.H - 18);
      }
      if (st.phase === 'contact') { drawContact(); return; }
      if (st.msg) {
        st.msgT += st.rt || 1;
        Kick.banner(ctx, st.msg, Math.max(0, 1 - st.msgT / (st.over ? 120 : 50)));
        if (!st.over && st.msgT > 50) st.msg = null;
      }
    }

    Kick._st = st;
    function loop(now) {
      // física em passos fixos de 1/60 s, multiplicados pela velocidade escolhida;
      // funciona igual em telas de 60, 90 ou 120 Hz
      const dt = Math.min(50, now - (st.last || now)); st.last = now;
      st.rt = dt / (1000 / 60);
      st.acc = (st.acc || 0) + st.rt * Kick.speed();
      while (st.acc >= 1) { physics(); st.acc -= 1; }
      draw();
      st.raf = requestAnimationFrame(loop);
    }
    st.raf = requestAnimationFrame(loop);
  },
};

// Minijogo defensivo: segure e arraste para mover seu jogador. Encoste no atacante para dar o bote,
// fique na linha do passe para interceptar ou na frente do chute para bloquear.
const Defend = {
  RESULTS: {
    tackle: 'Desarme!', intercept: 'Interceptação!', block: 'Chute bloqueado!', cover: 'O companheiro cortou o passe',
    saved: 'Defesa do goleiro', wide: 'O chute foi para fora', foul: 'Falta!', conceded: 'Gol do adversário',
  },

  scenario(oppOvr, gkOvr) {
    const R = U.rf;
    const n = U.ri(2, 3);
    const attackers = [];
    const lanes = U.shuffle([150, 260, 380, 490]).slice(0, n);
    lanes.forEach((x, i) => attackers.push({ x: x + R(-20, 20), y: R(370, 430), lane: x, seed: R(0, 6) }));
    return {
      title: 'Lance defensivo', oppOvr, gk: { x: 320, y: 30, ovr: gkOvr },
      attackers, carrier: U.ri(0, n - 1),
      me: { x: 320 + R(-60, 60), y: R(215, 250) },
      mate: { x: R(200, 440), y: R(150, 180) },
    };
  },

  // attrs: { forca, velocidade, tecnica, resistencia }
  start(host, sc, attrs, onDone) {
    host.innerHTML = `
      <div class="kick-wrap">
        <div class="kick-head"><b>${U.esc(sc.title)}</b><span>Segure e arraste para mover. Encoste no atacante para dar o bote.</span></div>
        <canvas id="def-canvas" width="${Kick.W}" height="${Kick.H}"></canvas>
        <div class="kick-controls">${Kick.speedSelect()}</div>
      </div>`;
    const cv = host.querySelector('#def-canvas');
    const ctx = cv.getContext('2d');
    const st = {
      me: { ...sc.me }, mate: { ...sc.mate }, gk: { ...sc.gk },
      atk: sc.attackers.map(a => ({ ...a })), carrier: sc.carrier,
      ball: { x: 0, y: 0, vx: 0, vy: 0, mode: 'held', to: null },
      target: null, stun: 0, stamina: 100, t: 0, lastPass: 0, over: false, msg: null, msgT: 0,
    };
    const atkSpeed = 1.2 + sc.oppOvr / 100 * 1.2;
    const mySpeed = 1.4 + attrs.velocidade / 100 * 1.8;

    const toLocal = (e) => {
      const r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) * Kick.W / r.width, y: (e.clientY - r.top) * Kick.H / r.height };
    };
    cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); st.target = toLocal(e); });
    cv.addEventListener('pointermove', (e) => { if (st.target) st.target = toLocal(e); });
    const release = () => { st.target = null; };
    cv.addEventListener('pointerup', release);
    cv.addEventListener('pointercancel', release);

    const finish = (result) => {
      if (st.over) return;
      st.over = true; st.msg = Defend.RESULTS[result]; st.msgT = 0;
      setTimeout(() => { cancelAnimationFrame(st.raf); onDone({ result }); }, 1900);
    };
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const moveTo = (o, tx, ty, sp) => {
      const d = Math.hypot(tx - o.x, ty - o.y);
      if (d < 0.5) return 0;
      const k = Math.min(sp, d) / d;
      o.x += (tx - o.x) * k; o.y += (ty - o.y) * k;
      return Math.min(sp, d);
    };

    function shoot(from) {
      const tx = U.rf(Kick.POST_L + 6, Kick.POST_R - 6) + (Math.random() < 0.2 ? U.rf(-40, 40) : 0);
      const sp = 8 + sc.oppOvr / 100 * 4;
      const d = Math.hypot(tx - from.x, Kick.GOAL_Y - 4 - from.y);
      st.ball = { x: from.x, y: from.y - 10, vx: (tx - from.x) / d * sp, vy: (Kick.GOAL_Y - 4 - from.y) / d * sp, mode: 'shot' };
    }

    function physics() {
      st.t++;
      if (st.over) {
        if (st.ball.mode !== 'held') { st.ball.x += st.ball.vx; st.ball.y += st.ball.vy; st.ball.vx *= 0.95; st.ball.vy *= 0.95; }
        return;
      }
      // seu jogador
      if (st.burst > 0) st.burst--;
      if (st.stun > 0) st.stun--;
      else if (st.target) {
        const tired = st.stamina <= 0 ? 0.5 : 1;
        const moved = moveTo(st.me, st.target.x, st.target.y, mySpeed * tired);
        st.stamina = Math.max(0, st.stamina - moved * 0.12 * (1.6 - attrs.resistencia / 100));
      }
      if (!st.target || st.stun > 0) st.stamina = Math.min(100, st.stamina + 0.35);
      st.me.x = U.clamp(st.me.x, 14, Kick.W - 14); st.me.y = U.clamp(st.me.y, Kick.GOAL_Y + 30, Kick.H - 10);

      const car = st.ball.mode === 'held' ? st.atk[st.carrier] : null;
      // atacantes
      st.atk.forEach((a, i) => {
        if (i === st.carrier && car) {
          let tx = 320 + Math.sin(st.t * 0.03 + a.seed) * 90, ty = 60;
          const dm = dist(a, st.me);
          if (dm < 80) { tx += (a.x - st.me.x) * 2.2; ty += 30; }
          moveTo(a, tx, ty, atkSpeed * (st.burst > 0 ? 1.6 : 1));
        } else {
          // os outros acompanham a jogada pelos corredores
          const ref = car ? car.y : st.ball.y;
          moveTo(a, a.lane + Math.sin(st.t * 0.02 + a.seed) * 30, Math.max(110, ref + 10), atkSpeed * 0.85);
        }
      });
      // companheiro marca o atacante livre mais perigoso
      const free = st.atk.filter((a, i) => i !== st.carrier).sort((a, b) => a.y - b.y)[0];
      if (free) moveTo(st.mate, free.x + (320 - free.x) * 0.25, free.y - 30, 1.5);
      // goleiro
      const g = st.gk, gkSp = 1.4 + g.ovr / 100 * 2.4;
      let gx = st.ball.mode === 'held' ? car.x : st.ball.x;
      if (st.ball.mode === 'shot' && st.ball.vy < 0) gx = st.ball.x + st.ball.vx * ((st.ball.y - g.y) / -st.ball.vy);
      g.x += U.clamp(U.clamp(gx, Kick.POST_L + 4, Kick.POST_R - 4) - g.x, -gkSp, gkSp);

      if (st.ball.mode === 'held') {
        st.ball.x = car.x; st.ball.y = car.y - 12;
        // bote
        if (st.stun <= 0 && dist(st.me, car) < 22) {
          const p = U.clamp(0.22 + attrs.forca / 250 + attrs.tecnica / 500 - sc.oppOvr / 400, 0.1, 0.75);
          if (Math.random() < p) return finish('tackle');
          if (Math.random() < 0.18) return finish('foul');
          st.stun = 60; st.burst = 45; st.msg = 'Driblado!'; st.msgT = 0;
          car.y -= 14;
        }
        // passe
        if (dist(st.me, car) < 70 && st.t - st.lastPass > 40 && Math.random() < 0.035) {
          const opts = st.atk.map((a, i) => [a, i]).filter(([a, i]) => i !== st.carrier && dist(a, st.me) > 70);
          if (opts.length) {
            const [rcv, ri] = U.pick(opts);
            const d = dist(rcv, car), sp = 6.5;
            st.ball = { x: car.x, y: car.y - 12, vx: (rcv.x - car.x) / d * sp, vy: (rcv.y - 20 - car.y + 12) / d * sp, mode: 'pass', to: ri };
            st.lastPass = st.t;
          }
        }
        // chute
        if (car.y < 165 || (car.y < 240 && Math.random() < 0.008)) shoot(car);
        return;
      }
      const b = st.ball;
      b.x += b.vx; b.y += b.vy;
      if (b.mode === 'pass') {
        if (dist(b, st.me) < 17 && st.stun <= 0) return finish('intercept');
        if (dist(b, st.mate) < 13) return finish('cover');
        const rcv = st.atk[b.to];
        if (dist(b, rcv) < 18) { st.carrier = b.to; b.mode = 'held'; return; }
        if (b.x < 0 || b.x > Kick.W || b.y < Kick.GOAL_Y || b.y > Kick.H) return finish('cover');
      } else if (b.mode === 'shot') {
        if (dist(b, st.me) < 17) { b.vx = -b.vx * 0.3 + U.rf(-2, 2); b.vy = -b.vy * 0.3; return finish('block'); }
        if (b.y <= g.y + 6 && b.y >= g.y - 8) {
          const sp = Math.hypot(b.vx, b.vy);
          if (Math.abs(b.x - g.x) < 16 + g.ovr / 100 * 9 && !(sp > 11 && Math.random() < (sp - 11) * 0.12)) {
            b.vy = -b.vy * 0.4; return finish('saved');
          }
        }
        if (b.y <= Kick.GOAL_Y) {
          if (b.x > Kick.POST_L && b.x < Kick.POST_R) { b.vx *= 0.3; b.vy *= 0.3; return finish('conceded'); }
          return finish('wide');
        }
      }
    }

    function draw() {
      Kick.drawPitch(ctx);
      st.atk.forEach(a => Kick.dot(ctx, a.x, a.y, '#d84343', '#7a1010'));
      Kick.dot(ctx, st.mate.x, st.mate.y, '#2f6fd6', '#0f2f66');
      Kick.dot(ctx, st.gk.x, st.gk.y, '#f2c12e', '#6b5200');
      Kick.dot(ctx, st.me.x, st.me.y, st.stun > 0 ? '#9aa7b4' : '#ffffff', '#1d4ed8', 'VOCÊ');
      if (st.target && !st.over) {
        ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(st.me.x, st.me.y); ctx.lineTo(st.target.x, st.target.y); ctx.stroke(); ctx.setLineDash([]);
      }
      Kick.ball(ctx, st.ball.x, st.ball.y);
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(14, Kick.H - 30, 124, 16);
      ctx.fillStyle = st.stamina < 25 ? '#ff6b6b' : '#7cd8ff'; ctx.fillRect(16, Kick.H - 28, 120 * st.stamina / 100, 12);
      ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Fôlego', 144, Kick.H - 18);
      if (st.msg) {
        st.msgT += st.rt || 1;
        Kick.banner(ctx, st.msg, Math.max(0, 1 - st.msgT / (st.over ? 120 : 50)));
        if (!st.over && st.msgT > 50) st.msg = null;
      }
    }

    Defend._st = st;
    function loop(now) {
      // física em passos fixos de 1/60 s, multiplicados pela velocidade escolhida;
      // funciona igual em telas de 60, 90 ou 120 Hz
      const dt = Math.min(50, now - (st.last || now)); st.last = now;
      st.rt = dt / (1000 / 60);
      st.acc = (st.acc || 0) + st.rt * Kick.speed();
      while (st.acc >= 1) { physics(); st.acc -= 1; }
      draw();
      st.raf = requestAnimationFrame(loop);
    }
    st.raf = requestAnimationFrame(loop);
  },
};

// Tela de partida ao vivo (compartilhada pelos dois modos)
const MatchView = {
  SPEEDS: { 1: 450, 2: 180, 3: 50 },

  open(host, w, m, opts) {
    const H = w.teams[m.sides[0].id], A = w.teams[m.sides[1].id];
    host.innerHTML = `
      <div class="match">
        <div class="scoreboard">
          <div class="sb-team"><span class="badge" style="background:${H.c1};color:${H.c2}">${H.short}</span>${U.esc(H.name)}</div>
          <div class="sb-score"><span id="mv-score">0 - 0</span><small id="mv-min">0'</small></div>
          <div class="sb-team right">${U.esc(A.name)}<span class="badge" style="background:${A.c1};color:${A.c2}">${A.short}</span></div>
        </div>
        <div class="match-body">
          <div class="match-main">
            <canvas id="mv-pitch" width="640" height="380"></canvas>
            <div id="mv-moment" class="hidden"></div>
            <div class="mv-bar">
              <button class="btn sm" id="mv-pause">⏸ Pausar</button>
              <span class="muted small">Velocidade:</span>
              <button class="btn sm sp" data-sp="1">1x</button>
              <button class="btn sm sp" data-sp="2">2x</button>
              <button class="btn sm sp" data-sp="3">4x</button>
              <button class="btn sm" id="mv-skip">⏭ Simular até o fim</button>
            </div>
            <div class="mv-stats" id="mv-stats"></div>
          </div>
          <div class="match-side">
            <div id="mv-extra"></div>
            <h4>Narração</h4>
            <div id="mv-feed" class="feed"></div>
          </div>
        </div>
      </div>`;
    const S = {
      speed: opts.speed || 2, paused: false, timer: null, ended: false, skipping: false,
      dots: null, ballPos: { x: 0.5, y: 0.5 }, ballTarget: { x: 0.5, y: 0.5 }, flash: 0,
    };
    const $ = (id) => host.querySelector('#' + id);
    const feed = $('mv-feed');

    const renderStats = () => {
      const tot = m.stats.poss[0] + m.stats.poss[1] || 1;
      const ph = Math.round(m.stats.poss[0] / tot * 100);
      $('mv-stats').innerHTML = `
        <div class="srow"><b>${ph}%</b><span>Posse de bola</span><b>${100 - ph}%</b></div>
        <div class="srow"><b>${m.stats.shots[0]}</b><span>Finalizações</span><b>${m.stats.shots[1]}</b></div>
        <div class="srow"><b>${m.stats.onT[0]}</b><span>No gol</span><b>${m.stats.onT[1]}</b></div>`;
      $('mv-score').textContent = m.score[0] + ' - ' + m.score[1];
      $('mv-min').textContent = m.minute + "'";
    };
    const addEvents = (evs) => evs.forEach(e => {
      const div = document.createElement('div');
      div.className = 'ev ev-' + e.type + (e.side === opts.userSide ? ' mine' : '');
      const icon = { goal: '⚽', save: '🧤', miss: '↗', yellow: '🟨', red: '🟥', injury: '✚', sub: '⇄', ht: '⏱', ft: '🏁', moment: '★' }[e.type] || '•';
      div.innerHTML = `<span class="evmin">${e.min}'</span> ${icon} ${U.esc(e.text)}`;
      feed.prepend(div);
      if (e.type === 'goal') S.flash = 60;
    });
    MatchView.addEvents = addEvents;
    const renderExtra = () => { if (opts.extraPanel) $('mv-extra').innerHTML = opts.extraPanel(m); };
    MatchView.refresh = () => { renderExtra(); renderStats(); };

    const tick = () => {
      if (S.paused || S.ended || S.waiting) return;
      if (opts.hook && opts.hook(m, resume, $('mv-moment'))) { S.waiting = true; return; }
      const evs = Engine.step(w, m);
      addEvents(evs);
      S.ballTarget = { x: m.ball, y: U.rf(0.15, 0.85) };
      renderStats();
      if (evs.some(e => e.type === 'goal' || e.type === 'injury' || e.type === 'red' || e.type === 'sub')) renderExtra();
      if (m.done) end();
    };
    function resume() {
      S.waiting = false;
      $('mv-moment').classList.add('hidden');
      $('mv-pitch').classList.remove('hidden');
      renderStats(); renderExtra();
    }
    function end() {
      S.ended = true; clearInterval(S.timer); cancelAnimationFrame(S.raf);
      $('mv-pause').disabled = true; $('mv-skip').disabled = true;
      renderStats();
      opts.onEnd(m);
    }
    const setSpeed = (sp) => {
      S.speed = sp; clearInterval(S.timer);
      S.timer = setInterval(tick, MatchView.SPEEDS[sp]);
      host.querySelectorAll('.sp').forEach(b => b.classList.toggle('active', +b.dataset.sp === sp));
    };
    host.querySelectorAll('.sp').forEach(b => b.onclick = () => setSpeed(+b.dataset.sp));
    $('mv-pause').onclick = () => {
      S.paused = !S.paused;
      $('mv-pause').textContent = S.paused ? '▶ Continuar' : '⏸ Pausar';
    };
    const doSkip = () => {
      clearInterval(S.timer);
      while (!m.done) {
        if (opts.hook && opts.hook(m, resume, $('mv-moment'), true)) continue;
        addEvents(Engine.step(w, m));
      }
      end();
    };
    $('mv-skip').onclick = () => {
      if (S.waiting || S.ended) return;
      if (opts.confirmSkip) UI.confirm(opts.confirmSkip, doSkip, 'Simular'); else doSkip();
    };
    MatchView.pause = (v) => { S.paused = v; $('mv-pause').textContent = S.paused ? '▶ Continuar' : '⏸ Pausar'; };

    // animação do campo
    const cv = $('mv-pitch'), ctx = cv.getContext('2d');
    const layout = (side, i) => {
      const f = FORMATIONS[side.formation];
      const pos = Engine.slotPos(side.formation, i);
      const counts = { GOL: 1, DEF: f.DEF, MEI: f.MEI, ATA: f.ATA };
      const idx = pos === 'GOL' ? 0 : pos === 'DEF' ? i - 1 : pos === 'MEI' ? i - 1 - f.DEF : i - 1 - f.DEF - f.MEI;
      const xs = { GOL: 0.05, DEF: 0.2, MEI: 0.36, ATA: 0.47 };
      return { x: xs[pos], y: (idx + 1) / (counts[pos] + 1) };
    };
    const draw = () => {
      const W = cv.width, Hh = cv.height;
      for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? '#2f8a3c' : '#2a7f36'; ctx.fillRect(i * W / 12, 0, W / 12, Hh); }
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
      ctx.strokeRect(8, 8, W - 16, Hh - 16);
      ctx.beginPath(); ctx.moveTo(W / 2, 8); ctx.lineTo(W / 2, Hh - 8); ctx.stroke();
      ctx.beginPath(); ctx.arc(W / 2, Hh / 2, 45, 0, 7); ctx.stroke();
      ctx.strokeRect(8, Hh / 2 - 80, 80, 160); ctx.strokeRect(W - 88, Hh / 2 - 80, 80, 160);
      ctx.strokeRect(8, Hh / 2 - 35, 28, 70); ctx.strokeRect(W - 36, Hh / 2 - 35, 28, 70);
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(2, Hh / 2 - 22, 6, 44); ctx.fillRect(W - 8, Hh / 2 - 22, 6, 44);

      S.ballPos.x += (S.ballTarget.x - S.ballPos.x) * 0.05;
      S.ballPos.y += (S.ballTarget.y - S.ballPos.y) * 0.05;
      const t = performance.now() / 1000;
      m.sides.forEach((side, si) => {
        const team = si === 0 ? H : A;
        side.xi.forEach((pid, i) => {
          if (pid == null || side.off.includes(pid)) return;
          const L = layout(side, i);
          const shift = (S.ballPos.x - 0.5) * 0.35;
          let x = si === 0 ? L.x + shift + (i ? 0.02 : 0) : 1 - L.x + shift - (i ? 0.02 : 0);
          if (i === 0) x = si === 0 ? 0.04 : 0.96;
          let y = L.y + (S.ballPos.y - 0.5) * 0.2 + Math.sin(t * 1.3 + pid) * 0.015;
          x += Math.cos(t * 0.9 + pid * 2) * 0.008;
          const X = 8 + x * (W - 16), Y = 8 + y * (Hh - 16);
          ctx.beginPath(); ctx.arc(X, Y, 8, 0, 7);
          ctx.fillStyle = team.c1; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = team.c2; ctx.stroke();
          if (pid === opts.highlight) { ctx.beginPath(); ctx.arc(X, Y, 13, 0, 7); ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 2; ctx.stroke(); }
        });
      });
      const bx = 8 + S.ballPos.x * (W - 16), by = 8 + S.ballPos.y * (Hh - 16);
      ctx.beginPath(); ctx.arc(bx, by, 5, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
      if (S.flash > 0) {
        S.flash--;
        ctx.fillStyle = `rgba(0,0,0,${Math.min(0.5, S.flash / 60)})`; ctx.fillRect(0, Hh / 2 - 40, W, 80);
        ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 48px sans-serif'; ctx.textAlign = 'center';
        ctx.globalAlpha = Math.min(1, S.flash / 30); ctx.fillText('GOL!', W / 2, Hh / 2 + 16); ctx.globalAlpha = 1;
      }
      S.raf = requestAnimationFrame(draw);
    };
    draw();
    renderExtra(); renderStats();
    setSpeed(S.speed);
    return S;
  },
};
